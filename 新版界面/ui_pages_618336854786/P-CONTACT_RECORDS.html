<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>往来记�?- 心来</title>
    <script src="https://unpkg.byted-static.com/coze/space_ppt_lib/1.0.3-alpha.12/lib/tailwindcss.js"></script>
    <script src="https://unpkg.byted-static.com/fortawesome/fontawesome-free/6.7.2/js/all.min.js" data-auto-replace-svg="nest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        tertiary: '#EC4899',
                        success: '#10B981',
                        danger: '#EF4444',
                        info: '#06B6D4',
                        'text-primary': '#1E293B',
                        'text-secondary': '#64748B',
                        'bg-primary': '#EEF2FF',
                        'bg-secondary': '#F3E8FF',
                        'card-bg': '#FFFFFF',
                        'border-light': '#E2E8F0'
                    },
                    boxShadow: {
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
                        'card-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'primary-btn': '0 10px 15px -3px rgba(59, 130, 246, 0.3), 0 4px 6px -2px rgba(59, 130, 246, 0.2)'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #EEF2FF 0%, #F3E8FF 100%);
        }
        
        .dynamic-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dynamic-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }

        .status-bar {
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .record-in {
            border-left: 4px solid #10B981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, rgba(16, 185, 129, 0.02) 100%);
        }

        .record-out {
            border-left: 4px solid #EF4444;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05) 0%, rgba(239, 68, 68, 0.02) 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- iOS状态栏 -->
    <div id="status-bar" class="status-bar text-white text-sm flex justify-between items-center px-4 py-1 safe-top">
        <div class="flex items-center space-x-1">
            <span class="font-medium">9:41</span>
        </div>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <div class="w-6 h-3 border border-white rounded-sm">
                <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
            </div>
        </div>
    </div>

    <!-- 主容�?-->
    <div id="main-container" class="max-w-sm mx-auto bg-white min-h-screen relative">
        <!-- 顶部导航�?-->
        <header id="top-header" class="bg-white px-4 py-3 border-b border-border-light">
            <div id="header-content" class="flex items-center justify-between">
                <button id="back-btn" class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center shadow-sm hover:shadow-md transition-all">
                    <i class="fas fa-arrow-left text-gray-600"></i>
                </button>
                <div class="flex-1 text-center">
                    <h1 id="contact-name" class="text-lg font-bold text-text-primary">往来记�?/h1>
                    <p id="contact-phone" class="text-sm text-text-secondary"></p>
                </div>
                <div class="w-10 h-10"></div> <!-- 占位符保持居�?-->
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main id="main-content" class="px-4 py-6 pb-24">
            <!-- 统计概览 -->
            <section id="summary-section" class="mb-6">
                <div class="bg-white rounded-3xl shadow-card p-6">
                    <h2 class="text-lg font-semibold text-text-primary mb-4">往来统�?/h2>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="text-center">
                            <div class="w-12 h-12 bg-gradient-to-br from-success to-green-500 rounded-xl flex items-center justify-center mx-auto mb-2">
                                <i class="fas fa-arrow-down text-white"></i>
                            </div>
                            <div class="text-sm text-text-secondary">收到</div>
                            <div id="total-received" class="text-lg font-bold text-success">¥0</div>
                        </div>
                        <div class="text-center">
                            <div class="w-12 h-12 bg-gradient-to-br from-danger to-red-500 rounded-xl flex items-center justify-center mx-auto mb-2">
                                <i class="fas fa-arrow-up text-white"></i>
                            </div>
                            <div class="text-sm text-text-secondary">送出</div>
                            <div id="total-given" class="text-lg font-bold text-danger">¥0</div>
                        </div>
                        <div class="text-center">
                            <div class="w-12 h-12 bg-gradient-to-br from-info to-blue-500 rounded-xl flex items-center justify-center mx-auto mb-2">
                                <i class="fas fa-balance-scale text-white"></i>
                            </div>
                            <div class="text-sm text-text-secondary">结余</div>
                            <div id="balance" class="text-lg font-bold text-info">¥0</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 往来记录列�?-->
            <section id="records-section">
                <div class="bg-white rounded-3xl shadow-card">
                    <div class="flex items-center justify-between p-6 border-b border-border-light">
                        <h2 class="text-lg font-semibold text-text-primary">详细记录</h2>
                        <div class="flex items-center space-x-2">
                            <button id="filter-btn" class="w-8 h-8 bg-gray-50 rounded-lg flex items-center justify-center shadow-sm">
                                <i class="fas fa-filter text-gray-600 text-sm"></i>
                            </button>
                        </div>
                    </div>
                    <div id="records-list" class="divide-y divide-border-light">
                        <!-- 加载状�?-->
                        <div id="loading-state" class="p-6 text-center">
                            <i class="fas fa-spinner fa-spin text-2xl text-gray-400 mb-2"></i>
                            <p class="text-gray-500">加载记录�?..</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部添加记录按钮 -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-border-light safe-bottom">
            <div class="max-w-sm mx-auto px-4 py-3">
                <button id="add-record-btn" class="w-full bg-primary text-white rounded-2xl py-4 font-medium shadow-primary-btn hover:bg-primary/90 transition-colors">
                    <i class="fas fa-plus mr-2"></i>
                    添加往来记�?
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取URL参数
            const urlParams = new URLSearchParams(window.location.search);
            const contactName = urlParams.get('contactName');
            const contactPhone = urlParams.get('contactPhone');
            const ledgerId = urlParams.get('ledger_id');
            
            // 定义API基础路径
            const hostname = window.location.hostname || 'localhost';
            const protocol = (window.location.protocol === 'file:' || window.location.protocol === 'capacitor:') ? 'http:' : window.location.protocol;
            const overrideApiBase = localStorage.getItem('API_BASE_OVERRIDE');
            const API_BASE = (overrideApiBase && overrideApiBase.trim()) ? overrideApiBase.replace(/\/+$/, '') : `${protocol}//${hostname}:3030/api`;

            
            if (!contactName) {
                alert('缺少联系人信�?);
                window.history.back();
                return;
            }

            // 设置页面标题
            document.getElementById('contact-name').textContent = `�?{contactName}的往来`;
            if (contactPhone) {
                document.getElementById('contact-phone').textContent = contactPhone;
            }

            // 返回按钮点击事件
            document.querySelector('#back-btn').addEventListener('click', function() {
                window.history.back();
            });

            // 添加记录按钮点击事件
            document.querySelector('#add-record-btn').addEventListener('click', function() {
                // 跳转到添加记录页面，并预填联系人信息
                let url = `P-ADD_RECORD.html?contactName=${encodeURIComponent(contactName)}&contactPhone=${encodeURIComponent(contactPhone || '')}`;
                if (ledgerId) {
                    url += `&ledger_id=${encodeURIComponent(ledgerId)}`;
                }
                window.location.href = url;
            });

            // 加载联系人往来记�?
            async function loadContactRecords(contactName) {
                console.log('加载联系人往来记�?', contactName);
                const recordsList = document.getElementById('records-list');
                
                try {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        throw new Error('未登�?);
                    }

                    if (typeof API_BASE === 'undefined') {
                        throw new Error('API_BASE 未定�?);
                    }

                    const response = await fetch(`${API_BASE}/records/contact/${encodeURIComponent(contactName)}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        console.log('获取到往来记�?', result);
                        
                        if (result.success && result.data) {
                            renderContactRecords(result.data);
                            updateSummary(result.data);
                        } else {
                            throw new Error('获取记录失败');
                        }
                    } else {
                        throw new Error('API调用失败');
                    }
                } catch (error) {
                    console.error('加载往来记录失�?', error);
                    showErrorState();
                }
            }

            // 加载往来记�?
            if (contactName) {
                loadContactRecords(contactName);
            }

            // 渲染往来记�?
            function renderContactRecords(records) {
                const recordsList = document.getElementById('records-list');
                recordsList.innerHTML = '';

                if (records.length === 0) {
                    showEmptyState();
                    return;
                }

                records.forEach(record => {
                    const recordCard = createRecordCard(record);
                    recordsList.appendChild(recordCard);
                });
            }

            // 创建记录卡片
            function createRecordCard(record) {
                const card = document.createElement('div');
                const isReceived = record.recordType === 'received';
                card.className = `p-6 ${isReceived ? 'record-in' : 'record-out'} hover:bg-gray-50 transition-colors`;
                
                // 格式化日�?
                const recordDate = new Date(record.recordDate).toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                const amountColor = isReceived ? 'text-success' : 'text-danger';
                const amountPrefix = isReceived ? '+' : '-';
                const typeIcon = isReceived ? 'fa-arrow-down' : 'fa-arrow-up';
                const typeText = isReceived ? '收到' : '送出';

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 ${isReceived ? 'bg-gradient-to-br from-success to-green-500' : 'bg-gradient-to-br from-danger to-red-500'} rounded-xl flex items-center justify-center">
                                <i class="fas ${typeIcon} text-white"></i>
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center space-x-2">
                                    <span class="font-medium text-text-primary">${record.ledger.ledgerName}</span>
                                    <span class="px-2 py-1 ${isReceived ? 'bg-success/10 text-success' : 'bg-danger/10 text-danger'} text-xs rounded-full">
                                        ${typeText}
                                    </span>
                                    ${record.isGiftItem ? '<i class="fas fa-gift text-info text-sm"></i>' : ''}
                                </div>
                                <div class="text-sm text-text-secondary mt-1">
                                    <div>${recordDate}</div>
                                    ${record.note ? `<div class="mt-1">${record.note}</div>` : ''}
                                </div>
                                ${record.isGiftItem && record.giftDescription ? `<div class="text-sm text-info mt-1">${record.giftDescription}</div>` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-lg ${amountColor}">
                                ${record.isGiftItem ? '物品' : `${amountPrefix}¥${record.amount}`}
                            </div>
                        </div>
                    </div>
                `;

                return card;
            }

            // 更新统计信息
            function updateSummary(records) {
                let totalReceived = 0;
                let totalGiven = 0;

                records.forEach(record => {
                    if (!record.isGiftItem) {
                        if (record.recordType === 'received') {
                            totalReceived += record.amount;
                        } else if (record.recordType === 'sent') {
                            totalGiven += record.amount;
                        }
                    }
                });

                const balance = totalReceived - totalGiven;

                document.getElementById('total-received').textContent = `¥${totalReceived.toLocaleString()}`;
                document.getElementById('total-given').textContent = `¥${totalGiven.toLocaleString()}`;
                
                const balanceElement = document.getElementById('balance');
                balanceElement.textContent = `¥${Math.abs(balance).toLocaleString()}`;
                
                // 根据结余调整颜色
                if (balance > 0) {
                    balanceElement.className = 'text-lg font-bold text-success';
                } else if (balance < 0) {
                    balanceElement.className = 'text-lg font-bold text-danger';
                } else {
                    balanceElement.className = 'text-lg font-bold text-info';
                }
            }

            // 显示空状�?
            function showEmptyState() {
                const recordsList = document.getElementById('records-list');
                recordsList.innerHTML = `
                    <div class="p-12 text-center">
                        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-exchange-alt text-gray-400 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-text-primary mb-2">暂无往来记�?/h3>
                        <p class="text-text-secondary">�?{contactName}还没有往来记�?/p>
                    </div>
                `;
            }

            // 显示错误状�?
            function showErrorState() {
                const recordsList = document.getElementById('records-list');
                recordsList.innerHTML = `
                    <div class="p-12 text-center">
                        <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-exclamation-triangle text-red-400 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-text-primary mb-2">加载失败</h3>
                        <p class="text-text-secondary mb-4">无法获取往来记�?/p>
                        <button id="retry-btn" class="px-4 py-2 bg-primary text-white rounded-lg text-sm hover:bg-primary/90 transition-colors">
                            重试
                        </button>
                    </div>
                `;
                
                // 绑定重试按钮事件
                setTimeout(() => {
                    const retryBtn = document.getElementById('retry-btn');
                    if (retryBtn) {
                        retryBtn.addEventListener('click', () => {
                            loadContactRecords(contactName);
                        });
                    }
                }, 0);
            }
        });
    </script>
</body>
</html>
