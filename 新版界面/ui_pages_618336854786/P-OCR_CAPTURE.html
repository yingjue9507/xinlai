<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心来 - AI识别</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar safe-top"><button class="top-action" id="back" type="button">‹</button><div class="brand"><div class="brand-mark">心</div><div><h1>AI识别</h1><small>把手写礼簿变成可审核数据</small></div></div><div style="width:42px"></div></header>
  <main class="page">
    <p class="eyebrow">SMART IMPORT</p>
    <h2 class="page-title">逐页识别手记薄</h2>
    <p class="page-subtitle">拍一页、审一页，确认后才会写入正式礼簿。</p>
    <section class="ocr-hero"><h2>让旧账本重新清晰</h2><p>请尽量正对页面拍摄，保持光线均匀。AI 识别结果会先进入草稿，所有记录都可以手动修改。</p></section>
    <section class="ocr-card"><h3>1. 选择目标礼簿</h3><div class="field"><label for="ledger-select">识别结果保存到</label><select id="ledger-select"><option value="">正在加载礼簿…</option></select></div><button class="btn btn-ghost btn-block" style="margin-top:10px" id="new-ledger" type="button">＋ 新建一本礼簿</button><form id="new-ledger-form" class="form-grid hidden" style="margin-top:14px"><div class="field"><label for="new-ledger-name">礼簿名称</label><input id="new-ledger-name" minlength="2" maxlength="20" placeholder="例如：父亲寿宴" required></div><div class="field"><label for="new-ledger-type">礼簿方向</label><select id="new-ledger-type"><option value="我办事">我办事 · 收礼</option><option value="参加别人的事">参加别人的事 · 送礼</option></select></div><div class="field"><label for="new-ledger-occasion">事情类型</label><select id="new-ledger-occasion"><option>结婚</option><option>生日</option><option>祝寿</option><option>满月</option><option>乔迁</option><option>其他</option></select></div><div class="modal-actions"><button class="btn btn-ghost" id="cancel-new-ledger" type="button">取消</button><button class="btn btn-primary" type="submit">保存礼簿</button></div></form></section>
    <section class="ocr-card"><h3>2. 拍摄或选择一页</h3><div class="ocr-progress"><span>当前批次</span><strong id="batch-count">尚未开始</strong></div><p class="data-tools-hint" style="margin-top:9px">每上传一页就会立即识别，审核后可以继续拍下一页。</p><div class="ocr-actions"><button class="btn btn-primary btn-block" id="start-camera" type="button">拍照识别一页</button><label class="btn btn-light btn-block file-button" for="gallery-input">从相册选择<input class="ocr-file-input" id="gallery-input" type="file" accept="image/jpeg,image/png,image/webp"></label></div><input class="ocr-file-input" id="camera-input" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><div id="upload-status" class="message hidden"></div></section>
    <section id="resume-card" class="ocr-card hidden"><h3>继续未完成的批次</h3><p class="data-tools-subtitle" id="resume-text"></p><button class="btn btn-light btn-block" id="resume-btn" type="button" style="margin-top:12px">继续审核</button><button class="btn btn-ghost btn-block" id="discard-btn" type="button" style="margin-top:10px">放弃这个草稿</button></section>
  </main>
  <nav class="bottom-nav safe-bottom"><button class="nav-item" data-nav="home" type="button"><b>⌂</b>首页</button><button class="nav-item" data-nav="ledger" type="button"><b>▤</b>礼簿</button><button class="nav-item nav-ai active" type="button"><span class="nav-ai-mark">✦</span><span class="nav-ai-label">AI识别</span></button><button class="nav-item" data-nav="contact" type="button"><b>♧</b>联系人</button><button class="nav-item" data-nav="profile" type="button"><b>♡</b>我的</button></nav>
</div>
<div id="toast" class="toast"></div>
<script>
  const token = localStorage.getItem('token'); if (!token) location.replace('P-LOGIN.html');
  const params = new URLSearchParams(location.search); const apiBase = () => (localStorage.getItem('API_BASE_OVERRIDE') || 'http://192.168.1.83:3030/api').replace(/\/+$/, '');
  let sessionId = params.get('session') || localStorage.getItem('OCR_SESSION_ID') || ''; let currentFile = null;
  const $ = id => document.getElementById(id); const toast = (text, error = false) => { const node = $('toast'); node.textContent = text; node.className = 'toast show' + (error ? ' error' : ''); clearTimeout(window.__toast); window.__toast = setTimeout(() => node.className = 'toast', 2800); };
  async function jsonRequest(path, options = {}) { const response = await fetch(apiBase() + path, { ...options, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(options.headers || {}) } }); const result = await response.json().catch(() => ({})); if (response.status === 401) { localStorage.removeItem('token'); location.replace('P-LOGIN.html'); throw new Error('登录已过期'); } if (!response.ok || result.success === false) throw new Error(result.message || '请求失败'); return result.data; }
  function showStatus(text, error = false) { $('upload-status').textContent = text; $('upload-status').className = 'message show' + (error ? ' error' : ' success'); }
  async function loadLedgers() { const ledgers = await jsonRequest('/ledgers'); const select = $('ledger-select'); select.innerHTML = ledgers.length ? ledgers.map(item => `<option value="${item.id}" ${item.id === params.get('ledger') ? 'selected' : ''}>${item.name || item.ledgerName} · ${item.occasion || '其他'}</option>`).join('') : '<option value="">请先新建礼簿</option>'; if (!ledgers.length) $('start-camera').disabled = true; }
  async function loadSession() { if (!sessionId) return; try { const data = await jsonRequest('/ocr/sessions/' + encodeURIComponent(sessionId)); $('batch-count').textContent = `${data.pages.length} 页 · ${data.pages.reduce((sum, page) => sum + page.rows.length, 0)} 条记录`; localStorage.setItem('OCR_SESSION_ID', sessionId); $('resume-card').classList.remove('hidden'); $('resume-text').textContent = `${data.ledgerName}，已识别 ${data.pages.length} 页`; $('resume-btn').onclick = () => location.href = 'P-OCR_REVIEW.html?session=' + encodeURIComponent(sessionId); $('discard-btn').onclick = discardSession; } catch (_) { sessionId = ''; localStorage.removeItem('OCR_SESSION_ID'); } }
  async function ensureSession() { if (sessionId) return sessionId; const ledgerId = $('ledger-select').value; if (!ledgerId) throw new Error('请先选择或新建礼簿'); const data = await jsonRequest('/ocr/sessions', { method: 'POST', body: JSON.stringify({ ledgerId }) }); sessionId = data.id; localStorage.setItem('OCR_SESSION_ID', sessionId); return sessionId; }
  async function uploadPage(file) { if (!file) return; currentFile = file; $('start-camera').disabled = true; showStatus('正在上传并识别这一页，请稍候…'); try { const id = await ensureSession(); const form = new FormData(); form.append('image', file, file.name || 'ledger-page.jpg'); const response = await fetch(apiBase() + '/ocr/sessions/' + encodeURIComponent(id) + '/pages', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: form }); const result = await response.json().catch(() => ({})); if (!response.ok || result.success === false) { if (result.data?.pageId) { location.href = 'P-OCR_REVIEW.html?session=' + encodeURIComponent(id) + '&page=' + encodeURIComponent(result.data.pageId); return; } throw new Error(result.message || '识别失败'); } const lastPage = result.data.pages[result.data.pages.length - 1]; location.href = 'P-OCR_REVIEW.html?session=' + encodeURIComponent(id) + '&page=' + encodeURIComponent(lastPage.id); } catch (error) { showStatus(error.message || '识别失败，可以重新选择图片重试', true); $('start-camera').disabled = false; } }
  async function discardSession() { if (!sessionId) return; try { await jsonRequest('/ocr/sessions/' + encodeURIComponent(sessionId), { method: 'DELETE' }); sessionId = ''; localStorage.removeItem('OCR_SESSION_ID'); $('resume-card').classList.add('hidden'); $('batch-count').textContent = '尚未开始'; toast('草稿已放弃'); } catch (error) { toast(error.message, true); } }
  $('start-camera').onclick = () => $('camera-input').click(); $('camera-input').onchange = event => uploadPage(event.target.files?.[0]); $('gallery-input').onchange = event => uploadPage(event.target.files?.[0]);
  $('new-ledger').onclick = () => $('new-ledger-form').classList.toggle('hidden'); $('cancel-new-ledger').onclick = () => $('new-ledger-form').classList.add('hidden');
  $('new-ledger-form').onsubmit = async event => { event.preventDefault(); const button = event.target.querySelector('button[type=submit]'); button.disabled = true; try { const data = await jsonRequest('/ledgers', { method: 'POST', body: JSON.stringify({ ledgerName: $('new-ledger-name').value.trim(), ledgerType: $('new-ledger-type').value, occasion: $('new-ledger-occasion').value }) }); await loadLedgers(); $('ledger-select').value = data.id; $('new-ledger-form').classList.add('hidden'); toast('礼簿已创建'); } catch (error) { toast(error.message, true); } finally { button.disabled = false; } };
  document.querySelectorAll('[data-nav]').forEach(item => item.onclick = () => location.replace('P-HOME.html?tab=' + item.dataset.nav)); $('back').onclick = () => history.length > 1 ? history.back() : location.replace('P-HOME.html');
  loadLedgers().then(loadSession).catch(error => toast(error.message, true));
</script>
</body>
</html>
