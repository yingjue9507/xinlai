<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心来 - 手机号换绑</title>
    <script src="https://unpkg.byted-static.com/coze/space_ppt_lib/1.0.3-alpha.12/lib/tailwindcss.js"></script>
    <script src="https://unpkg.byted-static.com/fortawesome/fontawesome-free/6.7.2/js/all.min.js" data-auto-replace-svg="nest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        tertiary: '#EC4899',
                        success: '#10B981',
                        danger: '#EF4444',
                        info: '#06B6D4',
                        'text-primary': '#1E293B',
                        'text-secondary': '#64748B',
                        'bg-primary': '#EEF2FF',
                        'bg-secondary': '#F3E8FF',
                        'card-bg': '#FFFFFF',
                        'border-light': '#E2E8F0'
                    },
                    boxShadow: {
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
                        'card-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'primary-btn': '0 10px 15px -3px rgba(59, 130, 246, 0.3), 0 4px 6px -2px rgba(59, 130, 246, 0.2)'
                    },
                    borderRadius: {
                        'xl': '0.75rem',
                        '2xl': '1rem',
                        '3xl': '1.5rem'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #EEF2FF 0%, #F3E8FF 100%);
        }
        
        .primary-gradient {
            background: linear-gradient(135deg, #3B82F6 0%, #60A5FA 100%);
            position: relative;
            overflow: hidden;
        }
        
        .primary-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .primary-gradient:hover::before {
            opacity: 1;
        }
        
        .status-bar {
            background: linear-gradient(135deg, #1F2937 0%, #374151 100%);
        }
        
        .cloud-pattern {
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
        }
        
        .dynamic-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dynamic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .form-input-focus:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        .btn-disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-disabled:hover {
            transform: none;
        }
    </style>
</head>
<body class="gradient-bg cloud-pattern min-h-screen">
    <!-- iOS状态栏 -->
    <div id="status-bar" class="status-bar text-white text-sm flex justify-between items-center px-4 py-1 safe-top">
        <div class="flex items-center space-x-1">
            <span class="font-medium">9:41</span>
        </div>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <div class="w-6 h-3 border border-white rounded-sm">
                <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
            </div>
        </div>
    </div>
    <!-- 主容器 -->
    <div id="main-container" class="max-w-sm mx-auto bg-white min-h-screen">
        <!-- 顶部导航栏 -->
        <header id="top-header" class="bg-white px-4 py-3 border-b border-border-light">
            <div id="header-content" class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <button id="back-btn" class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center shadow-sm hover:shadow-md transition-all">
                        <i class="fas fa-arrow-left text-gray-600"></i>
                    </button>
                    <h1 class="text-lg font-bold text-text-primary">手机号换绑</h1>
                </div>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main id="main-content" class="px-4 py-6">
            <!-- 当前绑定手机号显示 -->
            <section id="current-phone-section" class="mb-8">
                <div id="current-phone-card" class="bg-white rounded-3xl shadow-card p-6 dynamic-card">
                    <div id="current-phone-header" class="flex items-center space-x-3 mb-4">
                        <div class="w-12 h-12 bg-gradient-to-br from-primary to-tertiary rounded-xl flex items-center justify-center shadow-md">
                            <i class="fas fa-mobile-alt text-white text-lg"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-semibold text-text-primary">当前手机号</h2>
                            <p class="text-sm text-text-secondary">需要先验证原手机号</p>
                        </div>
                    </div>
                    <div id="current-phone-display" class="bg-gray-50 rounded-2xl p-4 flex items-center justify-between">
                        <span id="current-phone-number" class="text-text-primary font-medium">138****8888</span>
                        <span class="text-success text-sm font-medium">已绑定</span>
                    </div>
                </div>
            </section>

            <!-- 原手机号验证 -->
            <section id="original-verification-section" class="mb-8">
                <div id="original-verification-card" class="bg-white rounded-3xl shadow-card p-6 dynamic-card">
                    <h3 class="text-lg font-semibold text-text-primary mb-4">原手机号验证</h3>
                    <div class="space-y-4">
                        <div>
                            <label for="original-code" class="block text-sm font-medium text-text-primary mb-2">验证码</label>
                            <div class="flex space-x-3">
                                <input type="text" id="original-code" name="original-code" 
                                       class="flex-1 px-4 py-3 border border-border-light rounded-2xl form-input-focus text-text-primary" 
                                       placeholder="请输入验证码" maxlength="6">
                                <button id="get-original-code-btn" class="px-6 py-3 primary-gradient text-white rounded-2xl font-medium shadow-primary-btn dynamic-card">
                                    获取验证码
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 新手机号绑定 -->
            <section id="new-phone-section" class="mb-8">
                <div id="new-phone-card" class="bg-white rounded-3xl shadow-card p-6 dynamic-card">
                    <h3 class="text-lg font-semibold text-text-primary mb-4">绑定新手机号</h3>
                    <div class="space-y-4">
                        <div>
                            <label for="new-phone" class="block text-sm font-medium text-text-primary mb-2">新手机号</label>
                            <input type="tel" id="new-phone" name="new-phone" 
                                   class="w-full px-4 py-3 border border-border-light rounded-2xl form-input-focus text-text-primary" 
                                   placeholder="请输入新手机号" maxlength="11">
                        </div>
                        <div>
                            <label for="new-code" class="block text-sm font-medium text-text-primary mb-2">验证码</label>
                            <div class="flex space-x-3">
                                <input type="text" id="new-code" name="new-code" 
                                       class="flex-1 px-4 py-3 border border-border-light rounded-2xl form-input-focus text-text-primary" 
                                       placeholder="请输入验证码" maxlength="6">
                                <button id="get-new-code-btn" class="px-6 py-3 bg-gray-200 text-gray-500 rounded-2xl font-medium btn-disabled" disabled>
                                    获取验证码
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 确认换绑按钮 -->
            <section id="confirm-section" class="mb-8">
                <button id="confirm-bind-btn" class="w-full primary-gradient rounded-3xl shadow-primary-btn p-4 text-center dynamic-card btn-disabled" disabled>
                    <div class="text-white text-lg font-bold">确认换绑</div>
                    <div class="text-white text-sm opacity-90 mt-1">请先完成验证</div>
                </button>
            </section>
        </main>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-text-primary text-white px-6 py-3 rounded-2xl shadow-lg z-50 hidden">
        <span id="toast-message">操作成功</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let originalCountdown = 0;
            let newCountdown = 0;
            let originalCodeSent = false;
            let newCodeSent = false;

            // 返回按钮点击事件
            document.querySelector('#back-btn').addEventListener('click', function() {
                window.location.href = 'P-SETTINGS.html';
            });

            // 手机号格式验证
            function validatePhone(phone) {
                const phoneRegex = /^1[3-9]\d{9}$/;
                return phoneRegex.test(phone);
            }

            // 验证码格式验证
            function validateCode(code) {
                return /^\d{6}$/.test(code);
            }

            // 显示Toast提示
            function showToast(message, type = 'success') {
                const toast = document.querySelector('#toast');
                const toastMessage = document.querySelector('#toast-message');
                
                toastMessage.textContent = message;
                
                // 根据类型设置样式
                if (type === 'error') {
                    toast.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-danger text-white px-6 py-3 rounded-2xl shadow-lg z-50';
                } else {
                    toast.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-text-primary text-white px-6 py-3 rounded-2xl shadow-lg z-50';
                }
                
                toast.classList.remove('hidden');
                
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 3000);
            }

            // 倒计时功能
            function startCountdown(buttonId, duration, original = true) {
                const button = document.querySelector(buttonId);
                let countdown = duration;
                
                button.disabled = true;
                button.classList.add('btn-disabled');
                
                const timer = setInterval(() => {
                    button.textContent = `${countdown}秒后重试`;
                    countdown--;
                    
                    if (countdown < 0) {
                        clearInterval(timer);
                        button.disabled = false;
                        button.classList.remove('btn-disabled');
                        button.textContent = '获取验证码';
                        
                        if (original) {
                            originalCountdown = 0;
                        } else {
                            newCountdown = 0;
                        }
                    }
                }, 1000);
            }

            // 检查确认按钮状态
            function checkConfirmButton() {
                const originalCode = document.querySelector('#original-code').value;
                const newPhone = document.querySelector('#new-phone').value;
                const newCode = document.querySelector('#new-code').value;
                const confirmBtn = document.querySelector('#confirm-bind-btn');
                
                const canConfirm = validateCode(originalCode) && validatePhone(newPhone) && validateCode(newCode);
                
                if (canConfirm) {
                    confirmBtn.disabled = false;
                    confirmBtn.classList.remove('btn-disabled');
                    confirmBtn.innerHTML = `
                        <div class="text-white text-lg font-bold">确认换绑</div>
                        <div class="text-white text-sm opacity-90 mt-1">点击完成换绑</div>
                    `;
                } else {
                    confirmBtn.disabled = true;
                    confirmBtn.classList.add('btn-disabled');
                    confirmBtn.innerHTML = `
                        <div class="text-white text-lg font-bold">确认换绑</div>
                        <div class="text-white text-sm opacity-90 mt-1">请先完成验证</div>
                    `;
                }
            }

            // 获取原手机号验证码
            document.querySelector('#get-original-code-btn').addEventListener('click', function() {
                if (originalCountdown > 0) return;
                
                console.log('发送原手机号验证码到：138****8888');
                originalCodeSent = true;
                originalCountdown = 60;
                startCountdown('#get-original-code-btn', 60);
                showToast('验证码已发送，请查收');
            });

            // 新手机号输入验证
            document.querySelector('#new-phone').addEventListener('input', function() {
                const newPhone = this.value;
                const getNewCodeBtn = document.querySelector('#get-new-code-btn');
                
                if (validatePhone(newPhone)) {
                    getNewCodeBtn.disabled = false;
                    getNewCodeBtn.classList.remove('btn-disabled');
                    getNewCodeBtn.className = 'px-6 py-3 primary-gradient text-white rounded-2xl font-medium shadow-primary-btn dynamic-card';
                } else {
                    getNewCodeBtn.disabled = true;
                    getNewCodeBtn.classList.add('btn-disabled');
                    getNewCodeBtn.className = 'px-6 py-3 bg-gray-200 text-gray-500 rounded-2xl font-medium btn-disabled';
                }
                
                checkConfirmButton();
            });

            // 获取新手机号验证码
            document.querySelector('#get-new-code-btn').addEventListener('click', function() {
                if (newCountdown > 0) return;
                
                const newPhone = document.querySelector('#new-phone').value;
                if (!validatePhone(newPhone)) {
                    showToast('请输入正确的手机号', 'error');
                    return;
                }
                
                console.log(`发送新手机号验证码到：${newPhone}`);
                newCodeSent = true;
                newCountdown = 60;
                startCountdown('#get-new-code-btn', 60, false);
                showToast('验证码已发送，请查收');
            });

            // 验证码输入监听
            document.querySelector('#original-code').addEventListener('input', checkConfirmButton);
            document.querySelector('#new-code').addEventListener('input', checkConfirmButton);

            // 确认换绑
            document.querySelector('#confirm-bind-btn').addEventListener('click', function() {
                if (this.disabled) return;
                
                const originalCode = document.querySelector('#original-code').value;
                const newPhone = document.querySelector('#new-phone').value;
                const newCode = document.querySelector('#new-code').value;
                
                if (!validateCode(originalCode)) {
                    showToast('请输入正确的原验证码', 'error');
                    return;
                }
                
                if (!validatePhone(newPhone)) {
                    showToast('请输入正确的新手机号', 'error');
                    return;
                }
                
                if (!validateCode(newCode)) {
                    showToast('请输入正确的新验证码', 'error');
                    return;
                }
                
                // 模拟换绑过程
                this.disabled = true;
                this.innerHTML = `
                    <div class="text-white text-lg font-bold">换绑中...</div>
                    <div class="text-white text-sm opacity-90 mt-1">请稍候</div>
                `;
                
                setTimeout(() => {
                    console.log('手机号换绑成功');
                    showToast('手机号换绑成功');
                    
                    setTimeout(() => {
                        window.location.href = 'P-SETTINGS.html';
                    }, 1500);
                }, 2000);
            });
        });
    </script>
</body>
</html>
