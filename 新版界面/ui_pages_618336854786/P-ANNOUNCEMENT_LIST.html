<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区公告 - 心来</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#7C3AED',
                        tertiary: '#EC4899',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        info: '#3B82F6',
                        'text-primary': '#1F2937',
                        'text-secondary': '#6B7280',
                        'border-light': '#E5E7EB'
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'primary-btn': '0 4px 14px 0 rgba(79, 70, 229, 0.39)'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .cloud-pattern {
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.15) 0%, transparent 50%);
        }
        
        .dynamic-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dynamic-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }

        .status-bar {
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .announcement-card {
            border-left: 4px solid;
        }

        .red-event {
            border-left-color: #EF4444;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05) 0%, rgba(239, 68, 68, 0.02) 100%);
        }

        .white-event {
            border-left-color: #6B7280;
            background: linear-gradient(135deg, rgba(107, 114, 128, 0.05) 0%, rgba(107, 114, 128, 0.02) 100%);
        }
    </style>
</head>
<body class="gradient-bg cloud-pattern min-h-screen">
    <!-- iOS状态栏 -->
    <div id="status-bar" class="status-bar text-white text-sm flex justify-between items-center px-4 py-1 safe-top">
        <div class="flex items-center space-x-1">
            <span class="font-medium">9:41</span>
        </div>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <div class="w-6 h-3 border border-white rounded-sm">
                <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
            </div>
        </div>
    </div>

    <!-- 主容�?-->
    <div id="main-container" class="max-w-sm mx-auto bg-white min-h-screen relative">
        <!-- 顶部导航�?-->
        <header id="top-header" class="bg-white px-4 py-3 border-b border-border-light">
            <div id="header-content" class="flex items-center justify-between">
                <button id="back-btn" class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center shadow-sm hover:shadow-md transition-all">
                    <i class="fas fa-arrow-left text-gray-600"></i>
                </button>
                <h1 id="page-title" class="text-lg font-bold text-text-primary">社区公告</h1>
                <div class="w-10 h-10"></div> <!-- 占位符保持居�?-->
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main id="main-content" class="px-4 py-6 pb-24">
            <!-- 公告列表 -->
            <section id="announcement-list-section">
                <div id="announcement-list" class="space-y-4">
                    <!-- 加载状�?-->
                    <div id="loading-state" class="text-center py-8">
                        <i class="fas fa-spinner fa-spin text-2xl text-gray-400 mb-2"></i>
                        <p class="text-gray-500">加载公告�?..</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 返回按钮点击事件
            document.querySelector('#back-btn').addEventListener('click', function() {
                window.history.back();
            });

            // 加载公告列表
            loadAnnouncementList();

            // 加载公告列表数据
            async function loadAnnouncementList() {
                console.log('开始加载公告列�?..');
                const listContainer = document.getElementById('announcement-list');
                
                try {
                    const token = localStorage.getItem('token');
                    const headers = {};
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }

        // 定义API基础路径
                    const hostname = window.location.hostname || 'localhost';
            const protocol = (window.location.protocol === 'file:' || window.location.protocol === 'capacitor:') ? 'http:' : window.location.protocol;
            const overrideApiBase = localStorage.getItem('API_BASE_OVERRIDE');
            const API_BASE = (overrideApiBase && overrideApiBase.trim()) ? overrideApiBase.replace(/\/+$/, '') : `${protocol}//${hostname}:3030/api`;

                    const response = await fetch(`${API_BASE}/announcements/active?limit=50`, {
                        headers: headers
                    });

                    if (response.ok) {
                        const result = await response.json();
                        console.log('获取到公告列�?', result);
                        
                        if (result.success && result.data && result.data.length > 0) {
                            renderAnnouncementList(result.data);
                        } else {
                            showEmptyState();
                        }
                    } else {
                        throw new Error('获取公告列表失败');
                    }
                } catch (error) {
                    console.error('加载公告列表失败:', error);
                    showErrorState();
                }
            }

            // 渲染公告列表
            function renderAnnouncementList(announcements) {
                const listContainer = document.getElementById('announcement-list');
                listContainer.innerHTML = '';

                announcements.forEach(announcement => {
                    const announcementCard = createAnnouncementCard(announcement);
                    listContainer.appendChild(announcementCard);
                });
            }

            // 创建公告卡片
            function createAnnouncementCard(announcement) {
                const card = document.createElement('div');
                const isRedEvent = announcement.eventType === '红事';
                card.className = `announcement-card ${isRedEvent ? 'red-event' : 'white-event'} bg-white rounded-2xl p-6 shadow-card dynamic-card`;
                
                // 格式化日�?
                const eventDate = new Date(announcement.eventDate).toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                const publishDate = new Date(announcement.createdAt).toLocaleDateString('zh-CN', {
                    month: 'numeric',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const eventTypeIcon = isRedEvent ? '🎉' : '🕯�?;
                const eventTypeColor = isRedEvent ? 'text-red-500' : 'text-gray-500';
                const eventTypeBg = isRedEvent ? 'bg-red-50' : 'bg-gray-50';

                card.innerHTML = `
                    <div class="flex items-start space-x-4">
                        <div class="w-12 h-12 ${eventTypeBg} rounded-xl flex items-center justify-center flex-shrink-0">
                            <span class="text-2xl">${eventTypeIcon}</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-2 mb-2">
                                <h3 class="font-bold text-text-primary text-lg truncate">${announcement.title}</h3>
                                <span class="px-2 py-1 ${eventTypeBg} ${eventTypeColor} text-xs rounded-full font-medium flex-shrink-0">
                                    ${announcement.eventType}
                                </span>
                            </div>
                            <p class="text-text-secondary text-sm mb-3 leading-relaxed">${announcement.content}</p>
                            <div class="space-y-2">
                                <div class="flex items-center text-sm text-text-secondary">
                                    <i class="fas fa-calendar-alt w-4 text-center mr-2"></i>
                                    <span>事件时间�?{eventDate}</span>
                                </div>
                                ${announcement.location ? `
                                <div class="flex items-center text-sm text-text-secondary">
                                    <i class="fas fa-map-marker-alt w-4 text-center mr-2"></i>
                                    <span>地点�?{announcement.location}</span>
                                </div>
                                ` : ''}
                                ${announcement.contactInfo ? `
                                <div class="flex items-center text-sm text-text-secondary">
                                    <i class="fas fa-phone w-4 text-center mr-2"></i>
                                    <span>联系方式�?{announcement.contactInfo}</span>
                                </div>
                                ` : ''}
                                <div class="flex items-center justify-between text-xs text-gray-400 pt-2 border-t border-gray-100">
                                    <span>发布者：${announcement.publisherPhone}</span>
                                    <span>发布时间�?{publishDate}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                return card;
            }

            // 显示空状�?
            function showEmptyState() {
                const listContainer = document.getElementById('announcement-list');
                listContainer.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-bullhorn text-gray-400 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-text-primary mb-2">暂无公告</h3>
                        <p class="text-text-secondary">目前还没有发布任何公�?/p>
                    </div>
                `;
            }

            // 显示错误状�?
            function showErrorState() {
                const listContainer = document.getElementById('announcement-list');
                listContainer.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-exclamation-triangle text-red-400 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-text-primary mb-2">加载失败</h3>
                        <p class="text-text-secondary mb-4">无法获取公告信息</p>
                        <button onclick="loadAnnouncementList()" class="px-4 py-2 bg-primary text-white rounded-lg text-sm hover:bg-primary/90 transition-colors">
                            重试
                        </button>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
