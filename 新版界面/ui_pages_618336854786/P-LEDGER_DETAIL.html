                        primary: '#3B82F6',
                        secondary: '#8B5CF6',

                        success: '#10B981',
                        danger: '#EF4444',
                        info: '#06B6D4',
                        'text-primary': '#1E293B',
                        'text-secondary': '#64748B',
                        'bg-primary': '#EEF2FF',

    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #EEF2FF 0%, #F3E8FF 100%);
        }
        
        .primary-gradient {
            background: linear-gradient(135deg, #3B82F6 0%, #60A5FA 100%);
            position: relative;
            overflow: hidden;
        }
        
        .primary-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .primary-gradient:hover::before {
            opacity: 1;
        }
        
        .secondary-gradient {
            background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 100%);
        }

        }
        
        .white-funeral .text-text-primary {

        }
        
        .white-funeral .text-text-secondary {

        }

            border-color: #4B5563;
        }

            background-color: #4B5563;

        .white-funeral .text-success {

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 解析URL参数的辅助函�?            function getUrlParams() {
                const params = {};
                const queryString = window.location.search.substring(1);
                const urlParams = new URLSearchParams(queryString);
                
                for(const [key, value] of urlParams.entries()) {
                    params[key] = value;
                }
                return params;
            }

            // 获取URL参数
            const params = getUrlParams();
            const ledgerId = params.ledger_id || params.id; // 支持两种参数�?            
            console.log('URL参数:', params);
            console.log('礼簿ID:', ledgerId);
            
            if (!ledgerId) {
                alert('礼簿ID不存在，将返回礼簿列�?);
                window.location.href = 'P-LEDGER_LIST.html';
                return;
            }

            // 从localStorage获取token
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'P-LOGIN.html';
                return;
            }

            const overrideApiBase = localStorage.getItem('API_BASE_OVERRIDE');
            const proto = (window.location.protocol === 'file:' || window.location.protocol === 'capacitor:') ? 'http:' : window.location.protocol;
            const API_BASE = (overrideApiBase && overrideApiBase.trim()) ? overrideApiBase.replace(/\/+$/, '') : `${proto}//${window.location.hostname}:3030/api`;
            // 加载礼簿数据
            loadLedgerData(ledgerId);

            // 加载礼簿数据
            async function loadLedgerData(ledgerId) {
                try {
                    console.log('开始加载礼簿详�?', ledgerId);
                    
                    const response = await fetch(`${API_BASE}/ledgers/${ledgerId}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        const ledger = result.data;
                        console.log('获取到礼簿详�?', ledger);
                        
                        renderLedgerInfo(ledger);
                        loadRecords(ledgerId);
                    } else {
                        console.error('获取礼簿详情失败:', response.status);
                        alert('礼簿不存在或无权限访�?);
                        // 直接跳转到礼簿列表页�?                        window.location.href = 'P-LEDGER_LIST.html';
                    }
                } catch (error) {
                    console.error('加载礼簿详情失败:', error);
                    alert('网络错误，请检查后端服�?);
                    // 直接跳转到礼簿列表页�?                    window.location.href = 'P-LEDGER_LIST.html';
                }
            }

            // 渲染礼簿信息
            function renderLedgerInfo(ledger) {
                // 图标映射
                const iconMap = {
                    '婚嫁': { icon: 'fas fa-heart', gradient: 'from-primary to-tertiary' },
                    '满月': { icon: 'fas fa-baby', gradient: 'from-secondary to-purple-500' },
                    '乔迁': { icon: 'fas fa-home', gradient: 'from-secondary to-purple-500' },
                    '生日': { icon: 'fas fa-birthday-cake', gradient: 'from-yellow-400 to-orange-500' },
                    '白事': { icon: 'fas fa-cross', gradient: 'from-gray-600 to-gray-700' },
                    '其他': { icon: 'fas fa-ellipsis-h', gradient: 'from-blue-500 to-indigo-600' }
                };

                const iconInfo = iconMap[ledger.occasion] || iconMap['其他'];
                const creationDate = new Date(ledger.creationDate).toLocaleDateString('zh-CN');

                // 更新礼簿信息
                document.querySelector('#ledger-title').textContent = ledger.ledgerName;
                document.querySelector('#ledger-name').textContent = ledger.ledgerName;
                document.querySelector('#ledger-type').textContent = ledger.ledgerType;
                document.querySelector('#ledger-occasion').textContent = ledger.occasion;
                document.querySelector('#total-records').textContent = ledger.totalRecords || 0;
                document.querySelector('#total-amount').textContent = `¥${(ledger.totalAmount || 0).toLocaleString()}`;
                const avgEl = document.querySelector('#average-amount');
                if (avgEl) {
                    const receivedSum = (ledger.records || []).reduce((sum, r) => {
                        return sum + ((r.recordType === 'received' && !r.isGiftItem) ? Number(r.amount) : 0);
                    }, 0);
                    const sentSum = (ledger.records || []).reduce((sum, r) => {
                        return sum + ((r.recordType === 'sent' && !r.isGiftItem) ? Number(r.amount) : 0);
                    }, 0);
                    const diff = receivedSum - sentSum;
                    avgEl.textContent = `¥${Math.abs(diff).toLocaleString()}`;
                    if (diff > 0) {
                        avgEl.className = 'text-2xl font-bold text-success';
                    } else if (diff < 0) {
                        avgEl.className = 'text-2xl font-bold text-danger';
                    } else {
                        avgEl.className = 'text-2xl font-bold text-text-primary';
                    }
                }
                document.querySelector('#creation-date').textContent = `创建�?${creationDate}`;

                // 更新图标
                const occasionIcon = document.querySelector('#occasion-icon');
                occasionIcon.className = `w-16 h-16 bg-gradient-to-br ${iconInfo.gradient} rounded-2xl flex items-center justify-center shadow-lg`;
                occasionIcon.innerHTML = `<i class="${iconInfo.icon} text-white text-2xl"></i>`;

                // 更新通知按钮文字
                const notifyBtn = document.querySelector('#notify-friends-btn .text-lg');
                const notifySubtitle = document.querySelector('#notify-friends-btn .text-sm');
                if (ledger.occasion === '白事') {
                    notifyBtn.textContent = '通知亲友';
                    notifySubtitle.textContent = '发送讣告信�?;
                } else {
                    notifyBtn.textContent = '通知亲友';
                    notifySubtitle.textContent = '发送喜事邀�?;
                }
            }

            // 加载记录数据
            function loadRecords(ledgerId) {
                const recordsList = document.querySelector('#records-list');
                if (!recordsList) return;

                // 显示加载状�?                recordsList.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
                        <p>加载记录�?..</p>
                    </div>
                `;

                // 从后端获取记录数�?                fetch(`${API_BASE}/ledgers/${ledgerId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => response.json())
                .then(result => {
                    console.log('获取到礼簿详情和记录:', result);
                    
                    if (result.success && result.data.records) {
                        const records = result.data.records;
                        
                        if (records.length === 0) {
                            recordsList.innerHTML = `
                                <div class="text-center py-8 text-gray-500">
                                    <i class="fas fa-inbox text-3xl mb-2"></i>
                                    <p>暂无记录</p>
                                    <p class="text-sm">点击右上�?+"按钮添加记录</p>
                                </div>
                            `;
                        } else {
                            recordsList.innerHTML = '';
                            records.forEach(record => {
                                const recordElement = createRecordElement(record, result.data);
                                recordsList.appendChild(recordElement);
                            });
                        }
                    } else {
                        throw new Error('获取记录失败');
                    }
                })
                .catch(error => {
                    console.error('加载记录失败:', error);
                    recordsList.innerHTML = `
                        <div class="text-center py-8 text-gray-500">
                            <i class="fas fa-exclamation-triangle text-3xl mb-2"></i>
                            <p>加载记录失败</p>
                            <p class="text-sm">请刷新页面重�?/p>
                        </div>
                    `;
                });
            }

            // 创建记录元素
            function createRecordElement(record, ledger) {
                console.log('创建记录元素:', record);
                
                const recordDiv = document.createElement('div');
                recordDiv.className = 'p-6 hover:bg-gray-50 transition-colors cursor-pointer';
                recordDiv.dataset.recordId = record.id;
                recordDiv.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-gradient-to-br from-primary to-tertiary rounded-xl flex items-center justify-center shadow-md">
                                <span class="text-white font-bold text-lg">${record.contactName.charAt(0)}</span>
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center space-x-2">
                                    <span class="font-medium text-text-primary">${record.contactName}</span>
                                    ${record.isGiftItem ? '<i class="fas fa-gift text-info text-sm"></i>' : ''}
                                </div>
                                <div class="flex items-center space-x-4 text-sm text-text-secondary mt-1">
                                    <span>${record.note || '无备�?}</span>
                                    <span>${formatDate(record.recordDate)}</span>
                                </div>
                                ${record.isGiftItem && record.giftDescription ? `<div class="text-sm text-info mt-1">${record.giftDescription}</div>` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-lg ${record.recordType === 'sent' ? 'text-danger' : 'text-success'}">
                                ${record.isGiftItem ? '物品' : (record.recordType === 'sent' ? `-¥${record.amount}` : `+¥${record.amount}`)}
                            </div>
                        </div>
                    </div>
                `;
                
                // 添加长按事件
                let longPressTimer;
                let isLongPress = false;
                
                recordDiv.addEventListener('touchstart', function(e) {
                    isLongPress = false;
                    longPressTimer = setTimeout(() => {
                        isLongPress = true;
                        // 触发长按编辑
                        showEditRecordModal(record);
                        // 添加震动反馈（如果支持）
                        if (navigator.vibrate) {
                            navigator.vibrate(50);
                        }
                    }, 800); // 800ms长按
                });
                
                recordDiv.addEventListener('touchend', function(e) {
                    clearTimeout(longPressTimer);
                    if (!isLongPress) {
                        // 短按：跳转到联系人往来记录页�?                        console.log('短按记录，跳转到往来记�?', record.contactName);
                        window.location.href = `P-CONTACT_RECORDS.html?contactName=${encodeURIComponent(record.contactName)}&ledger_id=${encodeURIComponent(ledgerId)}`;
                    }
                });
                
                recordDiv.addEventListener('touchmove', function(e) {
                    clearTimeout(longPressTimer);
                });
                
                // 为桌面端添加右键菜单
                recordDiv.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    showEditRecordModal(record);
                });
                
                // 鼠标长按支持（桌面端�?                recordDiv.addEventListener('mousedown', function(e) {
                    if (e.button === 0) { // 左键
                        isLongPress = false;
                        longPressTimer = setTimeout(() => {
                            isLongPress = true;
                            showEditRecordModal(record);
                        }, 800);
                    }
                });
                
                recordDiv.addEventListener('mouseup', function(e) {
                    clearTimeout(longPressTimer);
                    if (!isLongPress && e.button === 0) {
                        // 短按：跳转到联系人往来记录页�?                        console.log('鼠标短按记录，跳转到往来记�?', record.contactName);
                        window.location.href = `P-CONTACT_RECORDS.html?contactName=${encodeURIComponent(record.contactName)}&ledger_id=${encodeURIComponent(ledgerId)}`;
                    }
                });
                
                recordDiv.addEventListener('mouseleave', function(e) {
                    clearTimeout(longPressTimer);
                });
                
                return recordDiv;
            }

            // 格式化日�?            function formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('zh-CN');
            }

            // 初始化页面数�?            loadLedgerData(ledgerId);

            // 返回按钮点击事件
            document.querySelector('#back-btn').addEventListener('click', function() {
                // 直接跳转到礼簿列表页面，确保返回逻辑正确
                window.location.href = 'P-LEDGER_LIST.html';
            });

            // 添加记录按钮点击事件
            document.querySelector('#add-record-btn').addEventListener('click', function() {
                document.querySelector('#add-record-modal').classList.remove('hidden');
            });

            // 关闭弹窗
            document.querySelector('#cancel-modal-btn').addEventListener('click', function() {
                document.querySelector('#add-record-modal').classList.add('hidden');
            });

            // 点击弹窗背景关闭
            document.querySelector('#add-record-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.add('hidden');
                }
            });

            // 手动录入按钮
            document.querySelector('#manual-add-btn').addEventListener('click', function() {
                window.location.href = `P-ADD_RECORD.html?ledger_id=${ledgerId}`;
            });

            // OCR导入按钮
            document.querySelector('#ocr-add-btn').addEventListener('click', function() {
                window.location.href = `P-OCR_IMPORT.html?ledger_id=${ledgerId}`;
            });

            // Excel导入按钮
            document.querySelector('#excel-add-btn').addEventListener('click', function() {
                window.location.href = `P-EXCEL_IMPORT.html?ledger_id=${ledgerId}`;
            });

            // 通知亲友按钮
            document.querySelector('#notify-friends-btn').addEventListener('click', function() {
                window.location.href = `P-NOTIFY_MASS.html?ledger_id=${ledgerId}`;
            });

            // 筛选按�?            document.querySelector('#filter-btn').addEventListener('click', function() {
                console.log('筛选功�?);
                // 这里可以实现筛选功�?            });

            // 排序按钮
            document.querySelector('#sort-btn').addEventListener('click', function() {
                console.log('排序功能');
                // 这里可以实现排序功能
            });

            // 全局变量存储当前编辑的记�?            let currentEditingRecord = null;

            // 显示编辑记录弹窗
            function showEditRecordModal(record) {
                console.log('显示编辑弹窗:', record);
                currentEditingRecord = record;
                
                const modal = document.getElementById('edit-record-modal');
                
                // 填充表单数据
                document.getElementById('edit-contact-name').value = record.contactName;
                document.getElementById('edit-amount').value = record.amount;
                document.getElementById('edit-record-date').value = record.recordDate.split('T')[0]; // 格式化日�?                document.getElementById('edit-is-gift-item').checked = record.isGiftItem;
                document.getElementById('edit-gift-description').value = record.giftDescription || '';
                document.getElementById('edit-note').value = record.note || '';
                
                // 控制物品描述显示
                const giftContainer = document.getElementById('edit-gift-description-container');
                if (record.isGiftItem) {
                    giftContainer.classList.remove('hidden');
                } else {
                    giftContainer.classList.add('hidden');
                }
                
                // 显示弹窗
                modal.classList.remove('hidden');
            }

            // 关闭编辑弹窗
            document.getElementById('close-edit-modal-btn').addEventListener('click', function() {
                document.getElementById('edit-record-modal').classList.add('hidden');
                currentEditingRecord = null;
            });

            // 非礼金物品开�?            document.getElementById('edit-is-gift-item').addEventListener('change', function() {
                const giftContainer = document.getElementById('edit-gift-description-container');
                if (this.checked) {
                    giftContainer.classList.remove('hidden');
                } else {
                    giftContainer.classList.add('hidden');
                }
            });

            // 保存编辑
            document.getElementById('save-edit-btn').addEventListener('click', async function() {
                const btn = this;
                const originalText = btn.innerHTML;
                
                try {
                    // 显示加载状�?                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>保存�?..';
                    
                    // 收集表单数据
                    const formData = {
                        contactName: document.getElementById('edit-contact-name').value.trim(),
                        amount: parseFloat(document.getElementById('edit-amount').value) || 0,
                        recordDate: document.getElementById('edit-record-date').value,
                        isGiftItem: document.getElementById('edit-is-gift-item').checked,
                        giftDescription: document.getElementById('edit-gift-description').value.trim(),
                        note: document.getElementById('edit-note').value.trim()
                    };

                    // 验证数据
                    if (!formData.contactName) {
                        alert('请输入联系人姓名');
                        return;
                    }

                    console.log('保存编辑数据:', formData);

                    // 调用后端API更新记录
                    const token = localStorage.getItem('token');
                    const response = await fetch(`${API_BASE}/records/${currentEditingRecord.id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(formData)
                    });

                    const result = await response.json();
                    console.log('更新记录结果:', result);

                    if (response.ok && result.success) {
                        alert('记录更新成功�?);
                        // 关闭弹窗
                        document.getElementById('edit-record-modal').classList.add('hidden');
                        // 重新加载记录数据
                        loadRecords(ledgerId);
                        // 重新加载礼簿统计数据
                        loadLedgerData(ledgerId);
                    } else {
                        throw new Error(result.message || '更新失败');
                    }
                } catch (error) {
                    console.error('更新记录失败:', error);
                    alert('更新失败: ' + error.message);
                } finally {
                    // 恢复按钮状�?                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            });

            // 删除记录
            document.getElementById('delete-record-btn').addEventListener('click', async function() {
                if (!confirm('确定要删除这条记录吗？删除后无法恢复�?)) {
                    return;
                }

                const btn = this;
                const originalText = btn.innerHTML;
                
                try {
                    // 显示加载状�?                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>删除�?..';
                    
                    console.log('删除记录:', currentEditingRecord.id);

                    // 调用后端API删除记录
                    const token = localStorage.getItem('token');

                    // 定义API基础路径
                    const hostname = window.location.hostname || 'localhost';
                    const protocol = window.location.protocol === 'file:' ? 'http:' : window.location.protocol;
                    const overrideApiBase = localStorage.getItem('API_BASE_OVERRIDE');
                    const API_BASE = (overrideApiBase && overrideApiBase.trim()) ? overrideApiBase.replace(/\/+$/, '') : `${protocol}//${hostname}:3030/api`;

                    const response = await fetch(`${API_BASE}/records/${currentEditingRecord.id}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    const result = await response.json();
                    console.log('删除记录结果:', result);

                    if (response.ok && result.success) {
                        alert('记录删除成功�?);
                        // 关闭弹窗
                        document.getElementById('edit-record-modal').classList.add('hidden');
                        // 重新加载记录数据
                        loadRecords(ledgerId);
                        // 重新加载礼簿统计数据
                        loadLedgerData(ledgerId);
                    } else {
                        throw new Error(result.message || '删除失败');
                    }
                } catch (error) {
                    console.error('删除记录失败:', error);
                    alert('删除失败: ' + error.message);
                } finally {
                    // 恢复按钮状�?                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            });
        });
    </script>
</body>
</html>
