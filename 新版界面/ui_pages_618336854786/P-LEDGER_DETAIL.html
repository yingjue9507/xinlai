<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>心来 - 礼簿明细</title><link rel="stylesheet" href="app.css"></head>
<body><div class="app-shell">
  <header class="topbar safe-top"><button class="top-action" id="back" type="button">‹</button><div class="brand"><div class="brand-mark">心</div><div><h1>礼簿明细</h1><small>每一笔往来都清清楚楚</small></div></div><button class="top-action" id="home" type="button">⌂</button></header>
  <main class="page"><div id="loading" class="empty">正在加载礼簿明细…</div><div id="error" class="hidden message error"></div><section id="content" class="hidden">
    <p class="eyebrow">LEDGER DETAIL</p><h2 class="page-title" id="ledger-name">礼簿</h2><p class="page-subtitle" id="ledger-meta"></p>
    <div class="detail-hero"><p>本簿合计</p><h2 id="ledger-total">¥0</h2><div class="detail-summary"><div><strong id="received-total">¥0</strong><span>收到</span></div><div><strong id="sent-total">¥0</strong><span>送出</span></div></div></div>
    <div class="section-head"><h2>往来明细</h2><span id="record-count" class="ledger-meta"></span></div><div id="record-list" class="card-list"></div>
    <button class="btn btn-primary btn-block" style="margin-top:18px" id="add-record" type="button">＋ 回到首页记一笔</button>
  </section></main>
  <nav class="bottom-nav safe-bottom"><button class="nav-item" data-nav="home" type="button"><b>⌂</b>首页</button><button class="nav-item active" data-nav="ledger" type="button"><b>▤</b>礼簿</button><button class="nav-item nav-ai" id="nav-ocr" type="button"><span class="nav-ai-mark">✦</span><span class="nav-ai-label">AI识别</span></button><button class="nav-item" data-nav="contact" type="button"><b>♧</b>联系人</button><button class="nav-item" data-nav="profile" type="button"><b>♡</b>我的</button></nav>
</div><script>
  const token = localStorage.getItem('token'); if (!token) location.replace('P-LOGIN.html');
  const id = new URLSearchParams(location.search).get('id');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const money = value => '¥' + Number(value || 0).toLocaleString('zh-CN', {minimumFractionDigits: 0, maximumFractionDigits: 2});
  const apiBase = () => { const override = localStorage.getItem('API_BASE_OVERRIDE'); return (override && override.trim() ? override.trim() : 'http://192.168.1.83:3030/api').replace(/\/+$/, ''); };
  async function load() { if (!id) throw new Error('缺少礼簿编号'); const response = await fetch(apiBase() + '/ledgers/' + encodeURIComponent(id), {headers: {Authorization: 'Bearer ' + token}}); const result = await response.json().catch(() => ({})); if (!response.ok || !result.success) throw new Error(result.message || '礼簿不存在'); const ledger = result.data; const records = ledger.records || []; let received = 0; let sent = 0; records.forEach(record => { if (!record.isGiftItem) { if (record.recordType === 'sent') sent += Number(record.amount || 0); else received += Number(record.amount || 0); } }); document.getElementById('ledger-name').textContent = ledger.ledgerName || '未命名礼簿'; document.getElementById('ledger-meta').textContent = `${ledger.occasion || '其他'} · ${ledger.ledgerType || '未分类'} · 创建于 ${String(ledger.creationDate || '').slice(0,10)}`; document.getElementById('ledger-total').textContent = money(received - sent); document.getElementById('received-total').textContent = money(received); document.getElementById('sent-total').textContent = money(sent); document.getElementById('record-count').textContent = records.length + ' 笔'; document.getElementById('record-list').innerHTML = records.length ? records.map(record => { const sentRecord = record.recordType === 'sent'; const amount = record.isGiftItem ? (record.giftDescription || '物品') : (sentRecord ? '-' : '+') + money(record.amount); return `<article class="detail-record"><div class="detail-record-head"><strong>${esc(record.contactName)}</strong><b class="${sentRecord ? 'sent' : 'received'}">${esc(amount)}</b></div><div class="detail-record-meta">${sentRecord ? '送出' : '收到'} · ${esc(String(record.recordDate || '').slice(0,10))}${record.isGiftItem ? ' · 非现金物品' : ''}</div>${record.note ? `<div class="detail-record-note">${esc(record.note)}</div>` : ''}</article>`; }).join('') : '<div class="empty">这本礼簿还没有明细记录。</div>'; document.getElementById('loading').classList.add('hidden'); document.getElementById('content').classList.remove('hidden'); }
  function fail(error) { document.getElementById('loading').classList.add('hidden'); const node = document.getElementById('error'); node.textContent = error.message || '加载失败'; node.classList.remove('hidden'); }
  document.getElementById('back').onclick = () => history.length > 1 ? history.back() : location.replace('P-HOME.html?tab=ledger'); document.getElementById('home').onclick = () => location.replace('P-HOME.html'); document.getElementById('add-record').onclick = () => location.replace('P-HOME.html?tab=home&record=1'); document.getElementById('nav-ocr').onclick = () => location.replace('P-OCR_CAPTURE.html?ledger=' + encodeURIComponent(id || '')); document.querySelectorAll('[data-nav]').forEach(item => item.onclick = () => location.replace('P-HOME.html?tab=' + item.dataset.nav)); load().catch(fail);
</script></body></html>
