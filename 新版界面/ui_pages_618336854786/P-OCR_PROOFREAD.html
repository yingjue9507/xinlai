<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核识别结果</title>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const ledger = params.get('ledger') || params.get('ledger_id') || '';
  const session = params.get('session') || '';
  const query = new URLSearchParams();
  if (ledger) query.set('ledger', ledger);
  if (session) query.set('session', session);
  location.replace('P-OCR_CAPTURE.html' + (query.toString() ? '?' + query.toString() : ''));
</script>
</body>
</html>
