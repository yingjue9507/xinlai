<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心来 - 登录</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><div class="brand-mark">心</div><div><h1>心来</h1><small>把人情往来，记得清楚</small></div></div>
    <p class="eyebrow">WELCOME BACK</p>
    <p class="intro">记录每一次真诚往来，让重要的人和重要的日子都有迹可循。</p>
    <div class="tabs" role="tablist"><button class="tab active" id="login-tab" type="button">登录</button><button class="tab" id="register-tab" type="button">注册</button></div>
    <form id="auth-form" class="form-grid">
      <div class="field"><label for="phone">手机号</label><input id="phone" inputmode="numeric" autocomplete="tel" placeholder="请输入手机号" required></div>
      <div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位" minlength="6" required></div>
      <button id="submit" class="btn btn-primary btn-block" type="submit">进入心来</button>
    </form>
    <div id="message" class="hidden message"></div>
    <div class="login-hint">本地测试账号：<strong>13800000000</strong> / <strong>123456</strong><br>也支持开发测试账号 123 / 123。</div>
    <p class="legal">登录即表示你同意心来的服务条款与隐私说明<br>当前为本地开发测试环境</p>
  </main>
<script>
  const form = document.getElementById('auth-form');
  const phone = document.getElementById('phone');
  const password = document.getElementById('password');
  const submit = document.getElementById('submit');
  const message = document.getElementById('message');
  const loginTab = document.getElementById('login-tab');
  const registerTab = document.getElementById('register-tab');
  let mode = 'login';
  function apiBase() { const override = localStorage.getItem('API_BASE_OVERRIDE'); return (override && override.trim() ? override.trim() : 'http://localhost:3030/api').replace(/\/+$/, ''); }
  function setMessage(text, type) { message.textContent = text; message.className = 'message ' + type; }
  function switchMode(next) { mode = next; loginTab.classList.toggle('active', mode === 'login'); registerTab.classList.toggle('active', mode === 'register'); submit.textContent = mode === 'login' ? '进入心来' : '创建账号'; password.setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password'); message.className = 'hidden message'; }
  loginTab.onclick = () => switchMode('login'); registerTab.onclick = () => switchMode('register');
  form.onsubmit = async (event) => {
    event.preventDefault(); const phoneNumber = phone.value.trim(); const secret = password.value.trim();
    if (!/^1[3-9]\d{9}$/.test(phoneNumber) && phoneNumber !== '123') return setMessage('请输入有效的手机号。', 'error');
    if (secret.length < 6 && !(mode === 'login' && phoneNumber === '123' && secret === '123')) return setMessage('密码至少需要 6 位。', 'error');
    submit.disabled = true; submit.textContent = mode === 'login' ? '正在登录…' : '正在创建…';
    try {
      const response = await fetch(apiBase() + (mode === 'login' ? '/auth/login' : '/auth/register'), { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ phoneNumber, password: secret }) });
      const result = await response.json(); if (!response.ok || !result.success) throw new Error(result.message || '请求失败');
      if (result.data && result.data.token) { localStorage.setItem('token', result.data.token); localStorage.setItem('user', JSON.stringify(result.data.user || {})); }
      setMessage(mode === 'login' ? '登录成功，正在进入…' : '注册成功，正在进入…', 'success'); setTimeout(() => location.replace('P-HOME.html'), 350);
    } catch (error) { setMessage(error.message || '无法连接后端，请确认服务运行在 3030 端口。', 'error'); submit.disabled = false; submit.textContent = mode === 'login' ? '进入心来' : '创建账号'; }
  };
</script>
</body>
</html>
