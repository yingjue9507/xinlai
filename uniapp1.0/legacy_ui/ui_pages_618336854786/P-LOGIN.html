<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心来 - 登录注册</title>
    <script src="https://unpkg.byted-static.com/coze/space_ppt_lib/1.0.3-alpha.12/lib/tailwindcss.js"></script>
    <script src="https://unpkg.byted-static.com/fortawesome/fontawesome-free/6.7.2/js/all.min.js" data-auto-replace-svg="nest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        tertiary: '#EC4899',
                        success: '#10B981',
                        danger: '#EF4444',
                        info: '#06B6D4',
                        'text-primary': '#1E293B',
                        'text-secondary': '#64748B',
                        'bg-primary': '#EEF2FF',
                        'bg-secondary': '#F3E8FF',
                        'card-bg': '#FFFFFF',
                        'border-light': '#E2E8F0'
                    },
                    boxShadow: {
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
                        'card-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'primary-btn': '0 10px 15px -3px rgba(59, 130, 246, 0.3), 0 4px 6px -2px rgba(59, 130, 246, 0.2)'
                    },
                    borderRadius: {
                        'xl': '0.75rem',
                        '2xl': '1rem',
                        '3xl': '1.5rem'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #EEF2FF 0%, #F3E8FF 100%);
        }
        
        .primary-gradient {
            background: linear-gradient(135deg, #3B82F6 0%, #60A5FA 100%);
            position: relative;
            overflow: hidden;
        }
        
        .primary-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .primary-gradient:hover::before {
            opacity: 1;
        }
        
        .status-bar {
            background: linear-gradient(135deg, #1F2937 0%, #374151 100%);
        }
        
        .cloud-pattern {
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
        }
        
        .dynamic-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dynamic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .form-input-focus:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        .btn-disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .error-message {
            color: theme('colors.danger');
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        
        .success-message {
            color: theme('colors.success');
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .tab-active {
            color: theme('colors.primary');
            border-bottom: 2px solid theme('colors.primary');
        }
        
        .tab-inactive {
            color: theme('colors.text-secondary');
            border-bottom: 2px solid transparent;
        }
    </style>
</head>
<body class="gradient-bg cloud-pattern min-h-screen">
    <!-- iOS状态栏 -->
    <div id="status-bar" class="status-bar text-white text-sm flex justify-between items-center px-4 py-1 safe-top">
        <div class="flex items-center space-x-1">
            <span class="font-medium">9:41</span>
        </div>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <div class="w-6 h-3 border border-white rounded-sm">
                <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
            </div>
        </div>
    </div>
    <!-- 主容�?-->
    <div id="main-container" class="max-w-sm mx-auto bg-white min-h-screen relative">
        <!-- 主要内容区域 -->
        <main id="main-content" class="px-6 py-12 min-h-screen flex flex-col justify-center">
            <!-- Logo和标题区�?-->
            <div id="logo-section" class="text-center mb-8">
                <div id="app-logo" class="w-20 h-20 bg-gradient-to-br from-primary to-tertiary rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl">
                    <i class="fas fa-heart text-white text-3xl"></i>
                </div>
                <h1 id="app-name" class="text-3xl font-bold text-text-primary mb-2">心来</h1>
                <p id="app-slogan" class="text-text-secondary">让人情往来更简�?/p>
            </div>

            <!-- 登录/注册 切换标签 -->
            <div class="flex justify-center mb-6">
                <button id="tab-login" class="px-6 py-2 text-lg font-semibold tab-active transition-colors">登录</button>
                <button id="tab-register" class="px-6 py-2 text-lg font-semibold tab-inactive transition-colors">注册</button>
            </div>

            <!-- 登录表单 -->
            <div id="login-form-container" class="bg-white rounded-3xl shadow-card p-8 dynamic-card">
                
                <form id="login-form" class="space-y-6">
                    <!-- 手机号输�?-->
                    <div id="phone-input-group" class="space-y-2">
                        <label for="phone-number" class="block text-sm font-medium text-text-primary">手机�?/label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-mobile-alt text-text-secondary"></i>
                            </div>
                            <input 
                                type="tel" 
                                id="phone-number" 
                                name="phone-number" 
                                class="w-full pl-12 pr-4 py-4 border border-border-light rounded-2xl form-input-focus bg-gray-50 placeholder-text-secondary" 
                                placeholder="请输入手机号"
                                maxlength="11"
                                required
                            >
                        </div>
                        <div id="phone-error" class="error-message hidden">请输入正确的手机�?/div>
                    </div>

                    <!-- 密码输入 -->
                    <div id="password-input-group" class="space-y-2">
                        <label for="password" class="block text-sm font-medium text-text-primary">密码</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-text-secondary"></i>
                            </div>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="w-full pl-12 pr-4 py-4 border border-border-light rounded-2xl form-input-focus bg-gray-50 placeholder-text-secondary" 
                                placeholder="请输入密�?(至少6�?"
                                minlength="6"
                                required
                            >
                        </div>
                        <div id="password-error" class="error-message hidden">密码长度至少6�?/div>
                    </div>

                    <!-- 登录按钮 -->
                    <button 
                        type="submit" 
                        id="submit-btn" 
                        class="w-full primary-gradient text-white py-4 rounded-2xl font-semibold text-lg shadow-primary-btn hover:shadow-card-hover transition-all disabled:btn-disabled"
                        disabled
                    >
                        <span id="submit-btn-text">登录</span>
                        <i id="submit-loading" class="fas fa-spinner fa-spin ml-2 hidden"></i>
                    </button>
                </form>

                <!-- 错误提示 -->
                <div id="form-error" class="error-message text-center mt-4 hidden"></div>
                
                <!-- 成功提示 -->
                <div id="form-success" class="success-message text-center mt-4 hidden"></div>
            </div>

            <!-- 用户协议 -->
            <div id="agreement-section" class="mt-8 text-center">
                <p class="text-sm text-text-secondary leading-relaxed">
                    <span id="action-text">登录</span>即表示同�?                    <a href="#" id="user-agreement-link" class="text-primary hover:text-primary/80 transition-colors">《用户协议�?/a>
                    �?                    <a href="#" id="privacy-policy-link" class="text-primary hover:text-primary/80 transition-colors">《隐私政策�?/a>
                </p>
            </div>
        </main>
    </div>

    <!-- 协议弹窗 -->
    <div id="agreement-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-card max-w-sm w-full max-h-96 overflow-hidden">
            <div class="p-6 border-b border-border-light">
                <h3 id="modal-title" class="text-lg font-semibold text-text-primary">用户协议</h3>
            </div>
            <div class="p-6 overflow-y-auto max-h-64">
                <div id="modal-content" class="text-sm text-text-secondary leading-relaxed space-y-4">
                    <!-- 协议内容将通过JavaScript动态填�?-->
                </div>
            </div>
            <div class="p-6 border-t border-border-light">
                <button id="close-modal-btn" class="w-full bg-primary text-white py-3 rounded-2xl font-medium hover:bg-primary/90 transition-colors">
                    我已阅读
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM元素
            const phoneInput = document.querySelector('#phone-number');
            const passwordInput = document.querySelector('#password');
            const submitBtn = document.querySelector('#submit-btn');
            const loginForm = document.querySelector('#login-form');
            const phoneError = document.querySelector('#phone-error');
            const passwordError = document.querySelector('#password-error');
            const formError = document.querySelector('#form-error');
            const formSuccess = document.querySelector('#form-success');
            const submitBtnText = document.querySelector('#submit-btn-text');
            const submitLoading = document.querySelector('#submit-loading');
            const userAgreementLink = document.querySelector('#user-agreement-link');
            const privacyPolicyLink = document.querySelector('#privacy-policy-link');
            const agreementModal = document.querySelector('#agreement-modal');
            const modalTitle = document.querySelector('#modal-title');
            const modalContent = document.querySelector('#modal-content');
            const closeModalBtn = document.querySelector('#close-modal-btn');
            const tabLogin = document.querySelector('#tab-login');
            const tabRegister = document.querySelector('#tab-register');
            const actionText = document.querySelector('#action-text');

            // 状态变�?            let isLoginMode = true; // 默认为登录模�?
            // 切换标签
            function switchTab(mode) {
                isLoginMode = mode === 'login';
                
                if (isLoginMode) {
                    tabLogin.className = 'px-6 py-2 text-lg font-semibold tab-active transition-colors';
                    tabRegister.className = 'px-6 py-2 text-lg font-semibold tab-inactive transition-colors';
                    submitBtnText.textContent = '登录';
                    actionText.textContent = '登录';
                } else {
                    tabLogin.className = 'px-6 py-2 text-lg font-semibold tab-inactive transition-colors';
                    tabRegister.className = 'px-6 py-2 text-lg font-semibold tab-active transition-colors';
                    submitBtnText.textContent = '注册';
                    actionText.textContent = '注册';
                }
                
                // 清空错误信息
                formError.classList.add('hidden');
                formSuccess.classList.add('hidden');
            }

            tabLogin.addEventListener('click', () => switchTab('login'));
            tabRegister.addEventListener('click', () => switchTab('register'));

            // 表单验证
            function validateForm() {
                const phone = phoneInput.value.trim();
                const password = passwordInput.value.trim();
                const isPhoneValid = /^1[3-9]\d{9}$/.test(phone) || phone === '123';
                const isPasswordValid = password.length >= 6;

                if (!isPhoneValid && phone.length === 11) {
                    phoneError.classList.remove('hidden');
                } else {
                    phoneError.classList.add('hidden');
                }

                if (!isPasswordValid && password.length > 0) {
                    passwordError.classList.remove('hidden');
                } else {
                    passwordError.classList.add('hidden');
                }

                if (isPhoneValid && isPasswordValid) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('btn-disabled');
                } else {
                    submitBtn.disabled = true;
                    submitBtn.classList.add('btn-disabled');
                }
            }

            phoneInput.addEventListener('input', validateForm);
            passwordInput.addEventListener('input', validateForm);

            // 提交表单
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const phone = phoneInput.value.trim();
                const password = passwordInput.value.trim();

                // 显示加载状�?                submitBtn.disabled = true;
                submitBtn.classList.add('btn-disabled');
                submitLoading.classList.remove('hidden');
                submitBtnText.textContent = isLoginMode ? '登录�?..' : '注册�?..';
                formError.classList.add('hidden');
                formSuccess.classList.add('hidden');

                try {
                    const overrideApiBase = localStorage.getItem('API_BASE_OVERRIDE');
                    const API_BASE = (overrideApiBase && overrideApiBase.trim()) ? overrideApiBase.replace(/\/+$/, '') : `${window.location.protocol}//${window.location.hostname}:3030/api`;
                    const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
                    
                    const response = await fetch(`${API_BASE}${endpoint}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            phoneNumber: phone,
                            password: password
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        formSuccess.textContent = result.message;
                        formSuccess.classList.remove('hidden');
                        
                        // 保存token
                        if (result.data && result.data.token) {
                            localStorage.setItem('token', result.data.token);
                            localStorage.setItem('user', JSON.stringify(result.data.user));
                            
                            // 延迟跳转
                            setTimeout(() => {
                                window.location.href = 'P-HOME.html';
                            }, 1000);
                        } else if (!isLoginMode) {
                             // 注册成功后自动切换到登录或直接登�?                             // 这里后端注册直接返回了token，所以上面逻辑已涵�?                             // 如果后端注册不返回token，则需切换到登录tab
                        }
                    } else {
                        throw new Error(result.message || (isLoginMode ? '登录失败' : '注册失败'));
                    }
                } catch (error) {
                    console.error('操作失败:', error);
                    formError.textContent = error.message;
                    formError.classList.remove('hidden');
                    
                    // 恢复按钮状�?                    submitBtn.disabled = false;
                    submitBtn.classList.remove('btn-disabled');
                    submitLoading.classList.add('hidden');
                    submitBtnText.textContent = isLoginMode ? '登录' : '注册';
                }
            });

            // 协议内容
            const userAgreementContent = `
                <h4 class="font-semibold text-text-primary mb-2">第一�?服务条款的确认和接纳</h4>
                <p>本协议是您与心来应用之间关于使用心来服务的法律协议�?/p>
                
                <h4 class="font-semibold text-text-primary mb-2">第二�?服务简�?/h4>
                <p>心来是一款专注于人际关系礼金往来管理的移动应用，为用户提供礼金记录、管理和统计服务�?/p>
                
                <h4 class="font-semibold text-text-primary mb-2">第三�?用户义务</h4>
                <p>用户应确保注册信息的真实性，妥善保管账户信息，不得从事违法违规活动�?/p>
                
                <h4 class="font-semibold text-text-primary mb-2">第四�?隐私保护</h4>
                <p>我们重视用户隐私保护，详细条款请查看《隐私政策》�?/p>
            `;

            const privacyPolicyContent = `
                <h4 class="font-semibold text-text-primary mb-2">信息收集</h4>
                <p>我们收集您主动提供的信息，如注册手机号、使用数据等�?/p>
                
                <h4 class="font-semibold text-text-primary mb-2">信息使用</h4>
                <p>收集的信息仅用于提供和改善服务，不会用于其他商业目的�?/p>
                
                <h4 class="font-semibold text-text-primary mb-2">信息保护</h4>
                <p>我们采用行业标准的安全措施保护您的个人信息�?/p>
            `;

            // 打开协议弹窗
            function openModal(title, content) {
                modalTitle.textContent = title;
                modalContent.innerHTML = content;
                agreementModal.classList.remove('hidden');
            }

            // 关闭协议弹窗
            closeModalBtn.addEventListener('click', function() {
                agreementModal.classList.add('hidden');
            });

            // 点击背景关闭弹窗
            agreementModal.addEventListener('click', function(e) {
                if (e.target === agreementModal) {
                    agreementModal.classList.add('hidden');
                }
            });

            userAgreementLink.addEventListener('click', function(e) {
                e.preventDefault();
                openModal('用户协议', userAgreementContent);
            });

            privacyPolicyLink.addEventListener('click', function(e) {
                e.preventDefault();
                openModal('隐私政策', privacyPolicyContent);
            });
        });
    </script>
</body>
</html>
