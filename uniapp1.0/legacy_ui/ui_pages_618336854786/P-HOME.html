<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心来 - 首页</title>
    <script src="https://unpkg.byted-static.com/coze/space_ppt_lib/1.0.3-alpha.12/lib/tailwindcss.js"></script>
    <script src="https://unpkg.byted-static.com/fortawesome/fontawesome-free/6.7.2/js/all.min.js" data-auto-replace-svg="nest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#DC2626',
                        secondary: '#F59E0B',
                        tertiary: '#EC4899',
                        success: '#10B981',
                        danger: '#EF4444',
                        info: '#06B6D4',
                        'text-primary': '#1F2937',
                        'text-secondary': '#6B7280',
                        'bg-primary': '#FEF2F2',
                        'bg-secondary': '#FEF3C7',
                        'card-bg': '#FFFFFF',
                        'border-light': '#E5E7EB'
                    },
                    boxShadow: {
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
                        'card-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'primary-btn': '0 10px 15px -3px rgba(220, 38, 38, 0.3), 0 4px 6px -2px rgba(220, 38, 38, 0.2)'
                    },
                    borderRadius: {
                        'xl': '0.75rem',
                        '2xl': '1rem',
                        '3xl': '1.5rem'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #FEF2F2 0%, #FEF3C7 100%);
        }
        
        .primary-gradient {
            background: linear-gradient(135deg, #DC2626 0%, #EF4444 100%);
            position: relative;
            overflow: hidden;
        }
        
        .primary-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .primary-gradient:hover::before {
            opacity: 1;
        }
        
        .secondary-gradient {
            background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 100%);
        }
        
        .status-bar {
            background: linear-gradient(135deg, #1F2937 0%, #374151 100%);
        }
        
        .cloud-pattern {
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(220, 38, 38, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(220, 38, 38, 0.05) 0%, transparent 50%);
        }
        
        .dynamic-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dynamic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }

        .red-envelope {
            background: linear-gradient(135deg, #DC2626 0%, #EF4444 50%, #DC2626 100%);
            border: 2px solid #B91C1C;
            position: relative;
        }

        .red-envelope::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 10px;
            background: #991B1B;
            border-radius: 0 0 10px 10px;
        }

        .red-envelope::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background: #F59E0B;
        }

        /* 公告滚动动画 */
        .announcement-scroll {
            animation: scroll-up 15s linear infinite;
        }

        @keyframes scroll-up {
            0% {
                transform: translateY(100%);
            }
            10% {
                transform: translateY(0%);
            }
            90% {
                transform: translateY(0%);
            }
            100% {
                transform: translateY(-100%);
            }
        }

        .announcement-item {
            padding: 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.5;
        }
    </style>
</head>
<body class="gradient-bg cloud-pattern min-h-screen">
    <!-- iOS状态栏 -->
    <div id="status-bar" class="status-bar text-white text-sm flex justify-between items-center px-4 py-1 safe-top">
        <div class="flex items-center space-x-1">
            <span class="font-medium">9:41</span>
        </div>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <div class="w-6 h-3 border border-white rounded-sm">
                <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
            </div>
        </div>
    </div>
    <!-- 主容�?-->
    <div id="main-container" class="max-w-sm mx-auto bg-white min-h-screen relative">
        <!-- 顶部导航�?-->
        <header id="top-header" class="bg-white px-4 py-3 border-b border-border-light">
            <div id="header-content" class="flex items-center justify-between">
                <div id="app-title" class="flex items-center space-x-2">
                    <div class="w-10 h-10 bg-gradient-to-br from-primary to-tertiary rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fas fa-heart text-white text-lg"></i>
                    </div>
                    <h1 class="text-lg font-bold text-text-primary">心来</h1>
                </div>
                <button id="settings-btn" class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center shadow-sm hover:shadow-md transition-all">
                    <i class="fas fa-cog text-gray-600"></i>
                </button>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main id="main-content" class="px-4 py-6 pb-24">
            <!-- 滚动公告�?-->
            <section id="announcement-section" class="mb-8">
                <div id="announcement-banner" class="bg-gradient-to-r from-red-500 to-pink-500 rounded-3xl shadow-xl overflow-hidden relative cursor-pointer hover:shadow-2xl transition-all duration-300 transform hover:scale-[1.03]">
                    <div class="absolute inset-0 bg-black bg-opacity-10"></div>
                    <div class="relative z-10 p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-white bg-opacity-20 rounded-full flex items-center justify-center mr-3">
                                    <i class="fas fa-bullhorn text-white text-sm"></i>
                                </div>
                                <span class="text-white text-lg font-bold">社区公告</span>
                            </div>
                            <div class="flex items-center text-white text-sm opacity-90">
                                <span class="mr-2">查看更多</span>
                                <i class="fas fa-chevron-right text-base"></i>
                            </div>
                        </div>
                        <div id="announcement-scroll" class="overflow-hidden h-12">
                            <div id="announcement-content" class="announcement-scroll">
                                <div class="text-white text-base">正在加载公告...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 人情总览区域 -->
            <section id="overview-section" class="mb-8">
                <div id="overview-card" class="bg-white rounded-3xl shadow-card p-6 dynamic-card overflow-hidden relative">
                    <div class="absolute top-0 right-0 w-40 h-40 bg-primary/5 rounded-full -mr-20 -mt-20"></div>
                    <h2 id="overview-title" class="text-lg font-semibold text-text-primary mb-6 relative z-10">人情总览</h2>
                    <div id="overview-stats" class="grid grid-cols-2 gap-4 relative z-10">
                        <div id="received-stat" class="text-center p-3 rounded-2xl bg-success/5">
                            <div class="w-14 h-14 bg-gradient-to-br from-success to-green-500 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                                <i class="fas fa-arrow-down text-white text-xl"></i>
                            </div>
                            <div class="text-2xl font-bold text-text-primary">¥0</div>
                            <div class="text-xs text-text-secondary mt-1">累计收礼</div>
                        </div>
                        <div id="given-stat" class="text-center p-3 rounded-2xl bg-info/5">
                            <div class="w-14 h-14 bg-gradient-to-br from-info to-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                                <i class="fas fa-arrow-up text-white text-xl"></i>
                            </div>
                            <div class="text-2xl font-bold text-text-primary">¥0</div>
                            <div class="text-xs text-text-secondary mt-1">累计送礼</div>
                        </div>
                        <div id="balance-stat" class="text-center p-3 rounded-2xl bg-primary/5">
                            <div class="w-14 h-14 bg-gradient-to-br from-primary to-danger rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                                <i class="fas fa-wallet text-white text-xl"></i>
                            </div>
                            <div class="text-2xl font-bold text-primary">¥0</div>
                            <div class="text-xs text-text-secondary mt-1">总结�?/div>
                        </div>
                        <div id="month-stat" class="text-center p-3 rounded-2xl bg-purple-50">
                            <div class="w-14 h-14 bg-gradient-to-br from-purple-500 to-purple-700 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                                <i class="fas fa-calendar-alt text-white text-xl"></i>
                            </div>
                            <div class="flex flex-col items-center justify-center">
                                <div class="text-sm text-text-secondary mb-1">�? <span id="month-received" class="font-bold text-success">¥0</span></div>
                                <div class="text-sm text-text-secondary">�? <span id="month-given" class="font-bold text-info">¥0</span></div>
                            </div>
                            <div class="text-xs text-text-secondary mt-2">本月统计</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 记一笔按�?-->
            <section id="quick-action-section" class="mb-8">
                <button id="add-record-btn" class="w-full red-envelope rounded-3xl shadow-primary-btn p-6 text-center dynamic-card group">
                    <div class="relative z-10 transition-transform group-hover:scale-105">
                        <div class="w-16 h-16 bg-white bg-opacity-20 backdrop-blur-sm rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-plus text-white text-2xl"></i>
                        </div>
                        <div class="text-white text-xl font-bold mb-2">记一�?/div>
                        <div class="text-white text-sm opacity-90">快速记录人情往�?/div>
                    </div>
                </button>
            </section>

            <!-- 近期动�?-->
            <section id="recent-activity-section">
                <div id="activity-card" class="bg-white rounded-3xl shadow-card p-6 dynamic-card">
                    <div id="activity-header" class="flex items-center justify-between mb-6">
                        <h2 class="text-lg font-semibold text-text-primary">近期动�?/h2>
                        <button id="view-all-btn" class="text-primary text-sm font-medium hover:text-primary/80 transition-colors">查看全部</button>
                    </div>
                    <div id="activity-list" class="space-y-3">
                        <!-- 动态加载的近期动�?-->
                        <div class="text-center py-8 text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载近期动�?..</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部导航�?-->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-border-light flex justify-around items-center h-16 px-2 safe-bottom z-40 max-w-sm mx-auto shadow-lg">
            <a id="nav-home" href="#" class="flex flex-col items-center p-2 text-primary relative group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors">
                    <i class="fas fa-home text-xl"></i>
                </div>
                <span class="text-xs font-medium">首页</span>
                <span class="absolute -top-1 w-2 h-2 bg-primary rounded-full"></span>
            </a>
            <a id="nav-ledger" href="#" class="flex flex-col items-center p-2 text-text-secondary group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors">
                    <i class="fas fa-book text-xl"></i>
                </div>
                <span class="text-xs">礼簿</span>
            </a>
            <a id="nav-contacts" href="#" class="flex flex-col items-center p-2 text-text-secondary group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors">
                    <i class="fas fa-users text-xl"></i>
                </div>
                <span class="text-xs">联系�?/span>
            </a>
            <a id="nav-notify" href="#" class="flex flex-col items-center p-2 text-text-secondary group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors relative">
                    <i class="fas fa-bell text-xl"></i>
                    <span class="absolute top-0 right-0 w-2 h-2 bg-danger rounded-full"></span>
                </div>
                <span class="text-xs">通知</span>
            </a>
            <a id="nav-profile" href="#" class="flex flex-col items-center p-2 text-text-secondary group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors">
                    <i class="fas fa-user text-xl"></i>
                </div>
                <span class="text-xs">我的</span>
            </a>
        </nav>
    </div>

    <!-- 礼簿选择弹窗 -->
    <div id="ledger-selection-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl p-6 m-4 max-w-sm w-full max-h-96 overflow-hidden">
            <!-- 弹窗标题 -->
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-text-primary">选择礼簿</h3>
                <button id="close-modal-btn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
                    <i class="fas fa-times text-text-secondary"></i>
                </button>
            </div>
            
            <!-- 礼簿列表 -->
            <div id="modal-ledger-list" class="space-y-3 max-h-64 overflow-y-auto">
                <!-- 动态生成礼簿项 -->
            </div>
            
            <!-- 底部按钮 -->
            <div class="mt-4 pt-4 border-t border-gray-100">
                <button id="create-new-ledger-btn" class="w-full py-3 bg-primary text-white rounded-xl font-medium hover:bg-primary/90 transition-colors">
                    <i class="fas fa-plus mr-2"></i>创建新礼�?                </button>
            </div>
        </div>
    </div>

    <script>
        // 定义API基础路径
        const hostname = window.location.hostname || 'localhost';
        const protocol = (window.location.protocol === 'file:' || window.location.protocol === 'capacitor:') ? 'http:' : window.location.protocol;
        const overrideApiBase = localStorage.getItem('API_BASE_OVERRIDE');
        const API_BASE = (overrideApiBase && overrideApiBase.trim()) ? overrideApiBase.replace(/\/+$/, '') : `${protocol}//${hostname}:3030/api`;

        document.addEventListener('DOMContentLoaded', function() {
            // 从localStorage获取token
            const token = localStorage.getItem('token');
            
            // 加载近期动态、统计数据和公告
            if (token) {
                loadRecentActivity();
                loadOverviewStats();
                loadAnnouncements();
            } else {
                // 未登录也显示公告
                loadAnnouncements();
            }
            
            // 记一笔按钮点击事�?            document.querySelector('#add-record-btn').addEventListener('click', async function() {
                // 检查用户是否有礼簿
                if (token) {
                    try {
                        const response = await fetch(`${API_BASE}/ledgers`, {
                            headers: {
                                'Authorization': `Bearer ${token}`
                            }
                        });
                        
                        if (response.ok) {
                            const result = await response.json();
                            const ledgers = result.data || [];
                            
                            if (ledgers.length === 0) {
                                // 没有礼簿，跳转到创建礼簿页面
                                console.log('没有礼簿，跳转到创建页面');
                                window.location.href = 'P-CREATE_LEDGER.html';
                            } else {
                                // 有礼簿，弹出选择窗口
                                console.log('有礼簿，显示选择窗口');
                                showLedgerSelectionModal(ledgers);
                            }
                        } else {
                            // API调用失败，默认跳转到创建礼簿
                            window.location.href = 'P-CREATE_LEDGER.html';
                        }
                    } catch (error) {
                        console.error('获取礼簿列表失败:', error);
                        // 出错时默认跳转到创建礼簿
                        window.location.href = 'P-CREATE_LEDGER.html';
                    }
                } else {
                    // 未登录，跳转到登录页
                    window.location.href = 'P-LOGIN.html';
                }
            });

            // 设置按钮点击事件
            document.querySelector('#settings-btn').addEventListener('click', function() {
                window.location.href = 'P-SETTINGS.html';
            });

            // 查看全部按钮点击事件
            document.querySelector('#view-all-btn').addEventListener('click', function() {
                window.location.href = 'P-LEDGER_LIST.html';
            });

            // 近期动态列表项点击事件
            const activityItems = document.querySelectorAll('[id^="activity-item-"]');
            activityItems.forEach(function(item) {
                item.addEventListener('click', function() {
                    const ledgerId = this.dataset.ledgerId;
                    window.location.href = `P-LEDGER_DETAIL.html?ledger_id=${ledgerId}`;
                });
            });

            // 底部导航栏点击事�?            document.querySelector('#nav-home').addEventListener('click', function(e) {
                e.preventDefault();
                // 已在首页，无需操作
            });

            document.querySelector('#nav-ledger').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-LEDGER_LIST.html';
            });

            document.querySelector('#nav-contacts').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-CONTACT_LIST.html';
            });

            document.querySelector('#nav-notify').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-NOTIFY_MASS.html';
            });

            document.querySelector('#nav-profile').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-SETTINGS.html';
            });

            // 公告栏点击事�?            document.querySelector('#announcement-banner').addEventListener('click', function() {
                window.location.href = 'P-ANNOUNCEMENT_LIST.html';
            });

            // 弹窗相关函数
            window.showLedgerSelectionModal = function(ledgers) {
                console.log('显示礼簿选择弹窗，礼簿数�?', ledgers.length);
                
                const modal = document.getElementById('ledger-selection-modal');
                const ledgerList = document.getElementById('modal-ledger-list');
                
                // 清空列表
                ledgerList.innerHTML = '';
                
                // 生成礼簿�?                ledgers.forEach(ledger => {
                    const ledgerItem = createLedgerItem(ledger);
                    ledgerList.appendChild(ledgerItem);
                });
                
                // 显示弹窗
                modal.classList.remove('hidden');
                
                // 绑定关闭事件
                document.getElementById('close-modal-btn').onclick = function() {
                    modal.classList.add('hidden');
                };
                
                // 点击背景关闭
                modal.onclick = function(e) {
                    if (e.target === modal) {
                        modal.classList.add('hidden');
                    }
                };
                
                // 创建新礼簿按�?                document.getElementById('create-new-ledger-btn').onclick = function() {
                    modal.classList.add('hidden');
                    window.location.href = 'P-CREATE_LEDGER.html';
                };
            };

            // 创建礼簿项元�?            function createLedgerItem(ledger) {
                const item = document.createElement('div');
                item.className = 'flex items-center p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-gray-100 transition-colors';
                
                // 图标映射
                const iconMap = {
                    '婚嫁': { icon: 'fas fa-heart', color: 'bg-red-500' },
                    '满月': { icon: 'fas fa-baby', color: 'bg-pink-500' },
                    '乔迁': { icon: 'fas fa-home', color: 'bg-blue-500' },
                    '生日': { icon: 'fas fa-birthday-cake', color: 'bg-yellow-500' },
                    '白事': { icon: 'fas fa-cross', color: 'bg-gray-600' },
                    '其他': { icon: 'fas fa-ellipsis-h', color: 'bg-purple-500' }
                };
                
                const iconInfo = iconMap[ledger.occasion] || iconMap['其他'];
                
                item.innerHTML = `
                    <div class="w-12 h-12 ${iconInfo.color} rounded-xl flex items-center justify-center mr-3">
                        <i class="${iconInfo.icon} text-white text-lg"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium text-text-primary">${ledger.name}</div>
                        <div class="text-sm text-text-secondary">${ledger.type} · ${ledger.occasion}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm text-text-secondary">${ledger.totalRecords || 0}条记�?/div>
                    </div>
                `;
                
                // 点击事件
                item.onclick = function() {
                    console.log('选择礼簿:', ledger.name, '(ID:', ledger.id, ')');
                    document.getElementById('ledger-selection-modal').classList.add('hidden');
                    window.location.href = `P-ADD_RECORD.html?ledger_id=${ledger.id}`;
                };
                
                return item;
            }

            // 加载近期动�?            async function loadRecentActivity() {
                console.log('开始加载近期动�?..');
                const activityList = document.getElementById('activity-list');
                
                try {
                    const response = await fetch(`${API_BASE}/records/recent`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        console.log('获取到近期动�?', result);
                        
                        if (result.success && result.data && result.data.length > 0) {
                            // 清空加载状�?                            activityList.innerHTML = '';
                            
                            // 渲染最新记�?                            result.data.forEach(record => {
                                const activityItem = createActivityItem(record);
                                activityList.appendChild(activityItem);
                            });
                        } else {
                            // 没有记录
                            activityList.innerHTML = `
                                <div class="text-center py-8 text-gray-500">
                                    <i class="fas fa-inbox text-2xl mb-2"></i>
                                    <p>暂无近期动�?/p>
                                    <p class="text-sm">快去添加第一条记录吧�?/p>
                                </div>
                            `;
                        }
                    } else {
                        throw new Error('获取近期动态失�?);
                    }
                } catch (error) {
                    console.error('加载近期动态失�?', error);
                    activityList.innerHTML = `
                        <div class="text-center py-8 text-gray-500">
                            <i class="fas fa-exclamation-triangle text-2xl mb-2"></i>
                            <p>加载失败</p>
                            <p class="text-sm">请刷新页面重�?/p>
                        </div>
                    `;
                }
            }

            // 创建活动项元�?            function createActivityItem(record) {
                const item = document.createElement('div');
                item.className = 'flex items-center space-x-3 p-4 bg-gray-50 rounded-2xl hover:bg-primary/5 transition-colors cursor-pointer';
                item.dataset.ledgerId = record.ledgerId;
                
                // 图标和颜色映�?                const iconMap = {
                    '婚嫁': { icon: 'fas fa-heart', color: 'from-red-500 to-pink-500' },
                    '满月': { icon: 'fas fa-baby', color: 'from-pink-500 to-purple-500' },
                    '乔迁': { icon: 'fas fa-home', color: 'from-blue-500 to-indigo-500' },
                    '生日': { icon: 'fas fa-birthday-cake', color: 'from-yellow-500 to-orange-500' },
                    '白事': { icon: 'fas fa-cross', color: 'from-gray-600 to-gray-700' },
                    '其他': { icon: 'fas fa-ellipsis-h', color: 'from-purple-500 to-indigo-500' }
                };
                
                const iconInfo = iconMap[record.ledger?.occasion] || iconMap['其他'];
                const isGift = record.isGiftItem;
                const amount = isGift ? '物品' : `+¥${record.amount}`;
                const amountColor = isGift ? 'text-info' : 'text-primary';
                
                item.innerHTML = `
                    <div class="w-12 h-12 bg-gradient-to-br ${iconInfo.color} rounded-xl flex items-center justify-center shadow-md">
                        <i class="${iconInfo.icon} text-white text-base"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between">
                            <span class="font-medium text-text-primary">${record.contactName}</span>
                            <span class="${amountColor} font-bold">${amount}</span>
                        </div>
                        <div class="flex items-center justify-between mt-1">
                            <span class="text-sm text-text-secondary">${record.ledger?.name || '未知礼簿'}</span>
                            <span class="text-xs text-text-secondary">${formatRelativeTime(record.recordDate)}</span>
                        </div>
                    </div>
                `;
                
                // 点击跳转到礼簿详�?                item.onclick = function() {
                    window.location.href = `P-LEDGER_DETAIL.html?ledger_id=${record.ledgerId}`;
                };
                
                return item;
            }

            // 格式化相对时�?            function formatRelativeTime(dateString) {
                const now = new Date();
                const date = new Date(dateString);
                const diffMs = now - date;
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                
                if (diffDays === 0) {
                    return '今天';
                } else if (diffDays === 1) {
                    return '昨天';
                } else if (diffDays < 7) {
                    return `${diffDays}天前`;
                } else if (diffDays < 30) {
                    const weeks = Math.floor(diffDays / 7);
                    return `${weeks}周前`;
                } else {
                    const months = Math.floor(diffDays / 30);
                    return `${months}个月前`;
                }
            }

            async function loadOverviewStats() {
                console.log('开始加载统计数�?..');
                
                try {
        const response = await fetch(`${API_BASE}/records/stats`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        console.log('获取到统计数�?', result);
                        
                        if (result.success && result.data) {
                            updateOverviewStats(result.data);
                        } else {
                            throw new Error('获取统计数据失败');
                        }
                    } else {
                        throw new Error('API调用失败');
                    }
                } catch (error) {
                    console.error('加载统计数据失败:', error);
                    // 保持默认显示，不显示错误给用�?                }
            }

            // 更新人情总览显示
            function updateOverviewStats(stats) {
                console.log('更新统计显示:', stats);
                
                // 格式化金额显�?                const formatAmount = (amount) => {
                    if (amount === 0) return '¥0';
                    return `¥${amount.toLocaleString()}`;
                };
                
                // 更新累计收礼
                const receivedElement = document.querySelector('#received-stat .text-2xl');
                if (receivedElement) {
                    receivedElement.textContent = formatAmount(stats.totalReceived);
                }
                
                // 更新累计送礼
                const givenElement = document.querySelector('#given-stat .text-2xl');
                if (givenElement) {
                    givenElement.textContent = formatAmount(stats.totalGiven);
                }
                
                // 更新结余
                const balanceElement = document.querySelector('#balance-stat .text-2xl');
                if (balanceElement) {
                    balanceElement.textContent = formatAmount(stats.balance);
                    
                    // 根据结余正负调整颜色
                    if (stats.balance > 0) {
                        balanceElement.className = 'text-2xl font-bold text-success';
                    } else if (stats.balance < 0) {
                        balanceElement.className = 'text-2xl font-bold text-danger';
                    } else {
                        balanceElement.className = 'text-2xl font-bold text-text-primary';
                    }
                }

                // 更新本月收礼
                const monthReceivedElement = document.querySelector('#month-received');
                if (monthReceivedElement) {
                    monthReceivedElement.textContent = formatAmount(stats.currentMonthReceived || 0);
                }

                // 更新本月送礼
                const monthGivenElement = document.querySelector('#month-given');
                if (monthGivenElement) {
                    monthGivenElement.textContent = formatAmount(stats.currentMonthGiven || 0);
                }
                
                console.log('统计数据更新完成');
            }

            // 加载公告数据
            async function loadAnnouncements() {
                console.log('开始加载公�?..');
                
                try {
                    const headers = {};
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }

        const response = await fetch(`${API_BASE}/announcements/active?limit=5`, {
                        headers: headers
                    });

                    if (response.ok) {
                        const result = await response.json();
                        console.log('获取到公告数�?', result);
                        
                        if (result.success && result.data && result.data.length > 0) {
                            displayAnnouncements(result.data);
                        } else {
                            // 没有公告时显示默认信�?                            displayDefaultAnnouncement();
                        }
                    } else {
                        throw new Error('获取公告失败');
                    }
                } catch (error) {
                    console.error('加载公告失败:', error);
                    displayDefaultAnnouncement();
                }
            }

            // 显示公告
            function displayAnnouncements(announcements) {
                const contentElement = document.getElementById('announcement-content');
                contentElement.innerHTML = '';
                
                announcements.forEach((announcement, index) => {
                    const announcementDiv = document.createElement('div');
                    announcementDiv.className = 'announcement-item text-white text-base font-medium';
                    
                    // 格式化事件日�?                    const eventDate = new Date(announcement.eventDate).toLocaleDateString('zh-CN');
                    const eventTypeIcon = announcement.eventType === '红事' ? '🎉' : '🕯�?;
                    
                    announcementDiv.innerHTML = `
                        ${eventTypeIcon} ${announcement.title} - ${eventDate} 
                        ${announcement.location ? `📍${announcement.location}` : ''} 
                        (${announcement.publisherPhone})
                    `;
                    
                    contentElement.appendChild(announcementDiv);
                });

                // 重新启动滚动动画
                contentElement.style.animation = 'none';
                setTimeout(() => {
                    contentElement.style.animation = 'scroll-up 15s linear infinite';
                }, 10);
            }

            // 显示默认公告
            function displayDefaultAnnouncement() {
                const contentElement = document.getElementById('announcement-content');
                contentElement.innerHTML = `
                    <div class="announcement-item text-white text-base font-medium">
                        🎉 欢迎使用心来人情记账，记录每一份温暖的人情往�?                    </div>
                `;
            }
        });
    </script>
