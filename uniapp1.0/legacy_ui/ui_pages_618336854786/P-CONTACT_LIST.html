        tailwind.config = {

    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #EEF2FF 0%, #F3E8FF 100%);

        .primary-gradient {
            background: linear-gradient(135deg, #3B82F6 0%, #60A5FA 100%);
            position: relative;
            overflow: hidden;
        }
        
        .primary-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .primary-gradient:hover::before {
            opacity: 1;
        }
        
        .status-bar {
            background: linear-gradient(135deg, #1F2937 0%, #374151 100%);

        .cloud-pattern {
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
        }
        
        .dynamic-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dynamic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .search-highlight {
            background-color: rgba(59, 130, 246, 0.2);
            border-radius: 2px;
            padding: 0 2px;
        }
        
        .alphabet-scroll {
            writing-mode: vertical-lr;
            text-orientation: mixed;
        }
        
        .contact-item {
            transition: all 0.2s ease;
        }
        
        .contact-item:hover {
            background-color: rgba(59, 130, 246, 0.05);
        }
        
        .section-header {
            background: linear-gradient(135deg, #EEF2FF 0%, #F3E8FF 100%);
        }
    </style>
</head>
<body class="gradient-bg cloud-pattern min-h-screen">
    <!-- iOS状态栏 -->
    <div id="status-bar" class="status-bar text-white text-sm flex justify-between items-center px-4 py-1 safe-top">
        <div class="flex items-center space-x-1">
            <span class="font-medium">9:41</span>
        </div>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <div class="w-6 h-3 border border-white rounded-sm">
                <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
            </div>
        </div>
    </div>
    <!-- 主容�?-->
    <div id="main-container" class="max-w-sm mx-auto bg-white min-h-screen relative">
        <!-- 顶部导航�?-->
        <header id="top-header" class="bg-white px-4 py-3 border-b border-border-light">
            <div id="header-content" class="flex items-center justify-between">
                <div id="app-title" class="flex items-center space-x-2">
                    <div class="w-10 h-10 bg-gradient-to-br from-primary to-tertiary rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fas fa-users text-white text-lg"></i>
                    </div>
                    <h1 class="text-lg font-bold text-text-primary">联系�?/h1>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="search-toggle-btn" class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center shadow-sm hover:shadow-md transition-all">
                        <i class="fas fa-search text-gray-600"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 搜索�?-->
        <div id="search-container" class="px-4 py-3 bg-white border-b border-border-light hidden">
            <div class="relative">
                <input type="text" id="search-input" placeholder="搜索联系人姓�? 
                       class="w-full pl-10 pr-4 py-3 bg-gray-50 rounded-2xl text-text-primary placeholder-text-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-all">
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-text-secondary"></i>
                <button id="search-clear-btn" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-text-secondary hover:text-text-primary hidden">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <main id="main-content" class="px-4 py-6 pb-24">
            <!-- 联系人统�?-->
            <section id="contact-stats-section" class="mb-6">
                <div id="stats-card" class="bg-white rounded-3xl shadow-card p-6 dynamic-card">
                    <h2 class="text-lg font-semibold text-text-primary mb-4">联系人统�?/h2>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="text-center p-3 rounded-2xl bg-primary/5">
                            <div id="total-contacts" class="text-2xl font-bold text-primary mb-1">0</div>
                            <div class="text-sm text-text-secondary">总联系人</div>
                        </div>
                        <div class="text-center p-3 rounded-2xl bg-success/5">
                            <div id="contacts-with-records" class="text-2xl font-bold text-success mb-1">0</div>
                            <div class="text-sm text-text-secondary">有往来记�?/div>
                        </div>
                        <div class="text-center p-3 rounded-2xl bg-info/5">
                            <div id="new-contacts-this-month" class="text-2xl font-bold text-info mb-1">0</div>
                            <div class="text-sm text-text-secondary">本月新增</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 联系人列�?-->
            <section id="contact-list-section">
                <div id="contact-list-card" class="bg-white rounded-3xl shadow-card overflow-hidden dynamic-card">
                    <!-- 联系人列表内�?-->
                    <div id="contact-list-content" class="divide-y divide-border-light">
                        <!-- 加载中状�?-->
                        <div class="p-8 text-center text-text-secondary">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载联系�?..</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部导航�?-->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-border-light flex justify-around items-center h-16 px-2 safe-bottom z-40 max-w-sm mx-auto shadow-lg">
            <a id="nav-home" href="P-HOME.html" class="flex flex-col items-center p-2 text-text-secondary group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors">
                    <i class="fas fa-home text-xl"></i>
                </div>
                <span class="text-xs">首页</span>
            </a>
            <a id="nav-ledger" href="P-LEDGER_LIST.html" class="flex flex-col items-center p-2 text-text-secondary group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors">
                    <i class="fas fa-book text-xl"></i>
                </div>
                <span class="text-xs">礼簿</span>
            </a>
            <a id="nav-contacts" href="#" class="flex flex-col items-center p-2 text-primary relative group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors">
                    <i class="fas fa-users text-xl"></i>
                </div>
                <span class="text-xs font-medium">联系�?/span>
                <span class="absolute -top-1 w-2 h-2 bg-primary rounded-full"></span>
            </a>
            <a id="nav-notify" href="P-NOTIFY_MASS.html" class="flex flex-col items-center p-2 text-text-secondary group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors relative">
                    <i class="fas fa-bell text-xl"></i>
                    <span class="absolute top-0 right-0 w-2 h-2 bg-danger rounded-full"></span>
                </div>
                <span class="text-xs">通知</span>
            </a>
            <a id="nav-profile" href="P-SETTINGS.html" class="flex flex-col items-center p-2 text-text-secondary group">
                <div class="w-10 h-10 flex items-center justify-center mb-1 rounded-full group-hover:bg-primary/10 transition-colors">
                    <i class="fas fa-user text-xl"></i>
                </div>
                <span class="text-xs">我的</span>
            </a>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 从localStorage获取token
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'P-LOGIN.html';
                return;
            }

            // 加载联系人数�?            loadContactData();

            // 搜索功能
            const searchToggleBtn = document.querySelector('#search-toggle-btn');
            const searchContainer = document.querySelector('#search-container');
            const searchInput = document.querySelector('#search-input');
            const searchClearBtn = document.querySelector('#search-clear-btn');
            const contactSections = document.querySelectorAll('.contact-section');
            const contactItems = document.querySelectorAll('.contact-item');

            // 切换搜索框显�?            searchToggleBtn.addEventListener('click', function() {
                searchContainer.classList.toggle('hidden');
                if (!searchContainer.classList.contains('hidden')) {
                    searchInput.focus();
                }
            });

            // 搜索输入处理
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase().trim();
                
                if (searchTerm) {
                    searchClearBtn.classList.remove('hidden');
                    filterContacts(searchTerm);
                } else {
                    searchClearBtn.classList.add('hidden');
                    showAllContacts();
                }
            });

            // 清除搜索
            searchClearBtn.addEventListener('click', function() {
                searchInput.value = '';
                searchClearBtn.classList.add('hidden');
                showAllContacts();
                searchInput.focus();
            });

            // 筛选联系人
            function filterContacts(searchTerm) {
                contactSections.forEach(section => {
                    const contactsInSection = section.querySelectorAll('.contact-item');
                    let hasVisibleContact = false;

                    contactsInSection.forEach(contact => {
                        const contactName = contact.querySelector('.font-medium').textContent.toLowerCase();
                        
                        if (contactName.includes(searchTerm)) {
                            contact.style.display = 'block';
                            hasVisibleContact = true;
                            
                            // 高亮搜索�?                            const nameElement = contact.querySelector('.font-medium');
                            const originalText = nameElement.textContent;
                            const regex = new RegExp(`(${searchTerm})`, 'gi');
                            nameElement.innerHTML = originalText.replace(regex, '<span class="search-highlight">$1</span>');
                        } else {
                            contact.style.display = 'none';
                        }
                    });

                    // 显示/隐藏字母分组标题
                    const sectionHeader = section.querySelector('.section-header');
                    if (hasVisibleContact) {
                        sectionHeader.style.display = 'block';
                    } else {
                        sectionHeader.style.display = 'none';
                    }
                });
            }

            // 显示所有联系人
            function showAllContacts() {
                contactSections.forEach(section => {
                    section.style.display = 'block';
                    const sectionHeader = section.querySelector('.section-header');
                    const contactsInSection = section.querySelectorAll('.contact-item');
                    
                    sectionHeader.style.display = 'block';
                    
                    contactsInSection.forEach(contact => {
                        contact.style.display = 'block';
                        
                        // 移除高亮
                        const nameElement = contact.querySelector('.font-medium');
                        if (nameElement.innerHTML.includes('<span class="search-highlight">')) {
                            nameElement.textContent = nameElement.textContent;
                        }
                    });
                });
            }

            // 联系人点击事件委�?            const contactListContent = document.querySelector('#contact-list-content');
            contactListContent.addEventListener('click', function(e) {
                const contactItem = e.target.closest('.contact-item');
                if (contactItem) {
                    const contactId = contactItem.dataset.contactId;
                    if (contactId) {
                        window.location.href = `P-CONTACT_DETAIL.html?contact_id=${contactId}`;
                    }
                }
            });

            // 底部导航栏点击事�?            document.querySelector('#nav-home').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-HOME.html';
            });

            document.querySelector('#nav-ledger').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-LEDGER_LIST.html';
            });

            document.querySelector('#nav-contacts').addEventListener('click', function(e) {
                e.preventDefault();
                // 已在联系人页面，无需操作
            });

            document.querySelector('#nav-notify').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-NOTIFY_MASS.html';
            });

            document.querySelector('#nav-profile').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-SETTINGS.html';
            });

            // 加载联系人数�?            async function loadContactData() {
                // 定义API基础路径
                const hostname = window.location.hostname || 'localhost';
            const protocol = (window.location.protocol === 'file:' || window.location.protocol === 'capacitor:') ? 'http:' : window.location.protocol;
            const overrideApiBase = localStorage.getItem('API_BASE_OVERRIDE');
            const API_BASE = (overrideApiBase && overrideApiBase.trim()) ? overrideApiBase.replace(/\/+$/, '') : `${protocol}//${hostname}:3030/api`;
                
                try {
                    console.log('开始加载联系人数据 - Version Check 2025-12-03-02');
                    console.log('API_BASE used:', API_BASE);
                
                    const response = await fetch(`${API_BASE}/contacts`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        console.log('获取到联系人数据:', result);
                        renderContactList(result.data);
                        updateContactStats(result.data);
                    } else {
                        console.error('获取联系人数据失�?', response.status);
                        showEmptyState();
                        updateContactStats([]);
                    }
                } catch (error) {
                    console.error('加载联系人数据失�?', error);
                    console.error('当前使用�?API_BASE:', API_BASE);
                    showEmptyState();
                }
            }

            // 更新联系人统�?            function updateContactStats(sections) {
                let totalContacts = 0;
                let contactsWithRecords = 0;
                let newContactsThisMonth = 0;
                
                const currentMonth = new Date().getMonth();
                const currentYear = new Date().getFullYear();
                
                if (sections && sections.length > 0) {
                    sections.forEach(section => {
                        if (section.data && section.data.length > 0) {
                            section.data.forEach(contact => {
                                totalContacts++;
                                
                                // 有往来记录的联系�?                                if (contact.transactionCount && contact.transactionCount > 0) {
                                    contactsWithRecords++;
                                }
                                
                                // 本月新增的联系人（假设有createdAt字段�?                                if (contact.createdAt) {
                                    const createdDate = new Date(contact.createdAt);
                                    if (createdDate.getMonth() === currentMonth && 
                                        createdDate.getFullYear() === currentYear) {
                                        newContactsThisMonth++;
                                    }
                                }
                            });
                        }
                    });
                }
                
                // 更新DOM
                document.getElementById('total-contacts').textContent = totalContacts;
                document.getElementById('contacts-with-records').textContent = contactsWithRecords;
                document.getElementById('new-contacts-this-month').textContent = newContactsThisMonth;
            }

            // 渲染联系人列�?            function renderContactList(sections) {
                const contactsContainer = document.querySelector('#contact-list-content');
                
                if (!sections || sections.length === 0) {
                    showEmptyState();
                    return;
                }

                let html = '';
                
                sections.forEach(section => {
                    if (section.data && section.data.length > 0) {
                        html += `
                            <div class="contact-section">
                                <div class="section-header px-6 py-3">
                                    <h3 class="font-semibold text-text-primary">${section.title}</h3>
                                </div>
                                <div class="px-6 py-2">
                        `;
                        
                        section.data.forEach(contact => {
                            const balance = contact.balance || 0;
                            const balanceColor = balance > 0 ? 'text-success' : balance < 0 ? 'text-danger' : 'text-text-secondary';
                            const balanceText = balance > 0 ? `+¥${balance.toLocaleString()}` : balance < 0 ? `-¥${Math.abs(balance).toLocaleString()}` : '¥0';
                            const balanceLabel = balance > 0 ? '收礼' : balance < 0 ? '送礼' : '平衡';
                            
                            html += `
                                <div class="contact-item p-4 rounded-2xl cursor-pointer" data-contact-id="${contact.id}">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-4">
                                            <div class="w-12 h-12 bg-gradient-to-br from-primary to-tertiary rounded-xl flex items-center justify-center shadow-md">
                                                <span class="text-white font-bold text-lg">${contact.name.charAt(0)}</span>
                                            </div>
                                            <div>
                                                <div class="font-medium text-text-primary">${contact.name}</div>
                                                <div class="text-sm text-text-secondary">累计往�?${contact.transactionCount || 0} �?/div>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-lg font-bold ${balanceColor}">${balanceText}</div>
                                            <div class="text-xs text-text-secondary">${balanceLabel}</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        
                        html += `
                                </div>
                            </div>
                        `;
                    }
                });

                contactsContainer.innerHTML = html;
            }

            // 显示空状�?            function showEmptyState() {
                const contactsContainer = document.querySelector('#contact-list-content');
                contactsContainer.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-users text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 mb-2">暂无联系�?/p>
                        <p class="text-sm text-gray-400">添加礼簿记录后，联系人会自动出现在这�?/p>
                    </div>
                `;
            }
        });
    </script>
</body>
