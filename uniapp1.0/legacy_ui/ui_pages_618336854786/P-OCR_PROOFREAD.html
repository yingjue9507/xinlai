<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心来 - 校对与修正</title>
    <script src="https://unpkg.byted-static.com/coze/space_ppt_lib/1.0.3-alpha.12/lib/tailwindcss.js"></script>
    <script src="https://unpkg.byted-static.com/fortawesome/fontawesome-free/6.7.2/js/all.min.js" data-auto-replace-svg="nest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        tertiary: '#EC4899',
                        success: '#10B981',
                        danger: '#EF4444',
                        info: '#06B6D4',
                        'text-primary': '#1E293B',
                        'text-secondary': '#64748B',
                        'bg-primary': '#EEF2FF',
                        'bg-secondary': '#F3E8FF',
                        'card-bg': '#FFFFFF',
                        'border-light': '#E2E8F0'
                    },
                    boxShadow: {
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
                        'card-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'primary-btn': '0 10px 15px -3px rgba(59, 130, 246, 0.3), 0 4px 6px -2px rgba(59, 130, 246, 0.2)'
                    },
                    borderRadius: {
                        'xl': '0.75rem',
                        '2xl': '1rem',
                        '3xl': '1.5rem'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #EEF2FF 0%, #F3E8FF 100%);
        }
        
        .primary-gradient {
            background: linear-gradient(135deg, #3B82F6 0%, #60A5FA 100%);
            position: relative;
            overflow: hidden;
        }
        
        .status-bar {
            background: linear-gradient(135deg, #1F2937 0%, #374151 100%);
        }
        
        .cloud-pattern {
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
        }
        
        .dynamic-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dynamic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }

        .highlight-row {
            background-color: rgba(59, 130, 246, 0.2);
            border: 2px solid #3B82F6;
        }

        .amount-btn {
            transition: all 0.2s ease;
        }

        .amount-btn:hover {
            transform: scale(1.05);
        }

        .amount-btn:active {
            transform: scale(0.98);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #3B82F6;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .image-preview {
            background: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), 
                        linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #f0f0f0 75%), 
                        linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="gradient-bg cloud-pattern min-h-screen">
    <!-- iOS状态栏 -->
    <div id="status-bar" class="status-bar text-white text-sm flex justify-between items-center px-4 py-1 safe-top">
        <div class="flex items-center space-x-1">
            <span class="font-medium">9:41</span>
        </div>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <div class="w-6 h-3 border border-white rounded-sm">
                <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
            </div>
        </div>
    </div>
    <!-- 主容器 -->
    <div id="main-container" class="max-w-sm mx-auto bg-white min-h-screen relative">
        <!-- 顶部导航栏 -->
        <header id="top-header" class="bg-white px-4 py-3 border-b border-border-light">
            <div id="header-content" class="flex items-center justify-between">
                <button id="back-btn" class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center shadow-sm hover:shadow-md transition-all">
                    <i class="fas fa-arrow-left text-gray-600"></i>
                </button>
                <h1 class="text-lg font-bold text-text-primary">校对与修正</h1>
                <button id="complete-btn" class="px-4 py-2 bg-primary text-white rounded-xl shadow-sm hover:shadow-md transition-all font-medium">
                    完成导入
                </button>
            </div>
        </header>
        
        <!-- 主要内容区域 -->
        <main id="main-content" class="px-4 py-6 pb-24">
            <!-- 进度指示器 -->
            <div id="progress-section" class="mb-6">
                <div class="bg-white rounded-2xl shadow-card p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-text-secondary">校对进度</span>
                        <span id="progress-text" class="text-sm font-medium text-primary">1 / 5</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="progress-bar" class="bg-primary h-2 rounded-full transition-all duration-300" style="width: 20%"></div>
                    </div>
                </div>
            </div>

            <!-- 分屏显示区域 -->
            <div id="split-screen" class="space-y-6">
                <!-- 上半部分：原图预览 -->
                <div id="image-section" class="bg-white rounded-2xl shadow-card p-4">
                    <h3 class="text-base font-semibold text-text-primary mb-3">原图预览</h3>
                    <div id="image-container" class="relative bg-gray-100 rounded-xl overflow-hidden image-preview">
                        <img id="preview-image" src="https://s.coze.cn/image/LxlLD5_ykEY/" alt="OCR识别原图" data-category="其他" class="w-full h-48 object-cover">
                        <div id="highlight-overlay" class="absolute inset-0 pointer-events-none">
                            <!-- 高亮当前行 -->
                            <div id="current-row-highlight" class="absolute left-4 right-4 bg-primary bg-opacity-30 border-2 border-primary rounded-lg transition-all duration-300" style="top: 20px; height: 40px;"></div>
                        </div>
                    </div>
                </div>

                <!-- 下半部分：识别结果编辑 -->
                <div id="edit-section" class="bg-white rounded-2xl shadow-card p-4">
                    <h3 class="text-base font-semibold text-text-primary mb-4">识别结果</h3>
                    
                    <!-- 姓名输入 -->
                    <div class="mb-4">
                        <label for="contact-name" class="block text-sm font-medium text-text-primary mb-2">姓名</label>
                        <input type="text" id="contact-name" class="w-full px-4 py-3 border border-border-light rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入姓名" value="张三">
                    </div>

                    <!-- 金额输入 -->
                    <div class="mb-4">
                        <label for="amount" class="block text-sm font-medium text-text-primary mb-2">金额</label>
                        <div class="flex space-x-3">
                            <input type="number" id="amount" class="flex-1 px-4 py-3 border border-border-light rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="0.00" value="500">
                            <div class="flex flex-wrap gap-2">
                                <button class="amount-btn px-3 py-2 bg-primary text-white rounded-lg text-sm font-medium" data-amount="200">200</button>
                                <button class="amount-btn px-3 py-2 bg-secondary text-white rounded-lg text-sm font-medium" data-amount="500">500</button>
                                <button class="amount-btn px-3 py-2 bg-tertiary text-white rounded-lg text-sm font-medium" data-amount="1000">1000</button>
                                <button class="amount-btn px-3 py-2 bg-success text-white rounded-lg text-sm font-medium" data-amount="2000">2000</button>
                            </div>
                        </div>
                    </div>

                    <!-- 非礼金开关 -->
                    <div class="mb-4">
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="text-sm font-medium text-text-primary">非礼金</span>
                            <label class="switch">
                                <input type="checkbox" id="non-money-switch">
                                <span class="slider"></span>
                            </label>
                        </label>
                    </div>

                    <!-- 物品描述（开关开启时显示） -->
                    <div id="gift-description-section" class="mb-4 hidden">
                        <label for="gift-description" class="block text-sm font-medium text-text-primary mb-2">物品描述</label>
                        <input type="text" id="gift-description" class="w-full px-4 py-3 border border-border-light rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入物品描述">
                    </div>

                    <!-- 备注输入 -->
                    <div class="mb-4">
                        <label for="note" class="block text-sm font-medium text-text-primary mb-2">备注</label>
                        <input type="text" id="note" class="w-full px-4 py-3 border border-border-light rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入备注" value="同事">
                    </div>

                    <!-- 日期选择 -->
                    <div class="mb-6">
                        <label for="record-date" class="block text-sm font-medium text-text-primary mb-2">日期</label>
                        <input type="date" id="record-date" class="w-full px-4 py-3 border border-border-light rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" value="2024-01-15">
                    </div>

                    <!-- 行切换按钮 -->
                    <div class="flex justify-between">
                        <button id="prev-row-btn" class="flex items-center space-x-2 px-4 py-3 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-left"></i>
                            <span>上一行</span>
                        </button>
                        <button id="next-row-btn" class="flex items-center space-x-2 px-4 py-3 bg-primary text-white rounded-xl hover:bg-primary/90 transition-all">
                            <span>下一行</span>
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 解析URL参数
            function getUrlParams() {
                const params = {};
                const queryString = window.location.search.substring(1);
                const urlParams = new URLSearchParams(queryString);
                
                for(const [key, value] of urlParams.entries()) {
                    params[key] = value;
                }
                return params;
            }

            // 获取URL参数
            const params = getUrlParams();
            const ledgerId = params.ledger_id || 'default_ledger';

            // 模拟OCR识别数据
            const ocrData = [
                {
                    name: "张三",
                    amount: "500",
                    note: "同事",
                    date: "2024-01-15",
                    isGift: false,
                    giftDescription: ""
                },
                {
                    name: "李四",
                    amount: "200",
                    note: "朋友",
                    date: "2024-01-15",
                    isGift: false,
                    giftDescription: ""
                },
                {
                    name: "王五",
                    amount: "1000",
                    note: "亲戚",
                    date: "2024-01-15",
                    isGift: false,
                    giftDescription: ""
                },
                {
                    name: "赵六",
                    amount: "0",
                    note: "同学",
                    date: "2024-01-15",
                    isGift: true,
                    giftDescription: "精美茶具一套"
                },
                {
                    name: "孙七",
                    amount: "800",
                    note: "邻居",
                    date: "2024-01-15",
                    isGift: false,
                    giftDescription: ""
                }
            ];

            let currentRow = 0;
            let correctedData = [...ocrData];

            // 更新表单数据
            function updateFormData() {
                const data = correctedData[currentRow];
                document.querySelector('#contact-name').value = data.name;
                document.querySelector('#amount').value = data.amount;
                document.querySelector('#note').value = data.note;
                document.querySelector('#record-date').value = data.date;
                document.querySelector('#non-money-switch').checked = data.isGift;
                document.querySelector('#gift-description').value = data.giftDescription;
                
                // 更新非礼金物品描述显示状态
                updateGiftDescriptionVisibility();
                
                // 更新进度显示
                updateProgress();
                
                // 更新按钮状态
                updateButtonStates();
                
                // 更新高亮行
                updateHighlightRow();
            }

            // 更新非礼金物品描述显示状态
            function updateGiftDescriptionVisibility() {
                const isGift = document.querySelector('#non-money-switch').checked;
                const section = document.querySelector('#gift-description-section');
                const amountInput = document.querySelector('#amount');
                
                if (isGift) {
                    section.classList.remove('hidden');
                    amountInput.disabled = true;
                    amountInput.classList.add('opacity-50');
                } else {
                    section.classList.add('hidden');
                    amountInput.disabled = false;
                    amountInput.classList.remove('opacity-50');
                }
            }

            // 更新进度显示
            function updateProgress() {
                const progress = ((currentRow + 1) / ocrData.length) * 100;
                document.querySelector('#progress-bar').style.width = progress + '%';
                document.querySelector('#progress-text').textContent = `${currentRow + 1} / ${ocrData.length}`;
            }

            // 更新按钮状态
            function updateButtonStates() {
                const prevBtn = document.querySelector('#prev-row-btn');
                const nextBtn = document.querySelector('#next-row-btn');
                
                if (currentRow === 0) {
                    prevBtn.disabled = true;
                } else {
                    prevBtn.disabled = false;
                }
                
                if (currentRow === ocrData.length - 1) {
                    nextBtn.innerHTML = '<span>完成</span><i class="fas fa-check"></i>';
                } else {
                    nextBtn.innerHTML = '<span>下一行</span><i class="fas fa-chevron-right"></i>';
                }
            }

            // 更新高亮行
            function updateHighlightRow() {
                const highlight = document.querySelector('#current-row-highlight');
                const rowHeights = [40, 80, 120, 160, 200]; // 模拟不同行的位置
                highlight.style.top = rowHeights[currentRow] + 'px';
            }

            // 保存当前行数据
            function saveCurrentRowData() {
                const data = correctedData[currentRow];
                data.name = document.querySelector('#contact-name').value;
                data.amount = document.querySelector('#amount').value;
                data.note = document.querySelector('#note').value;
                data.date = document.querySelector('#record-date').value;
                data.isGift = document.querySelector('#non-money-switch').checked;
                data.giftDescription = document.querySelector('#gift-description').value;
            }

            // 上一行按钮点击事件
            document.querySelector('#prev-row-btn').addEventListener('click', function() {
                if (currentRow > 0) {
                    saveCurrentRowData();
                    currentRow--;
                    updateFormData();
                }
            });

            // 下一行按钮点击事件
            document.querySelector('#next-row-btn').addEventListener('click', function() {
                saveCurrentRowData();
                
                if (currentRow < ocrData.length - 1) {
                    currentRow++;
                    updateFormData();
                } else {
                    // 最后一行，完成当前行后显示完成提示
                    alert('所有行已校对完成！');
                }
            });

            // 金额快速选择按钮事件
            const amountBtns = document.querySelectorAll('.amount-btn');
            amountBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const amount = this.getAttribute('data-amount');
                    document.querySelector('#amount').value = amount;
                });
            });

            // 非礼金开关事件
            document.querySelector('#non-money-switch').addEventListener('change', function() {
                updateGiftDescriptionVisibility();
            });

            // 返回按钮点击事件
            document.querySelector('#back-btn').addEventListener('click', function() {
                window.location.href = `P-OCR_IMPORT.html?ledger_id=${ledgerId}`;
            });

            // 完成导入按钮点击事件
            document.querySelector('#complete-btn').addEventListener('click', function() {
                saveCurrentRowData();
                
                // 显示加载动画
                this.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>导入中...';
                this.disabled = true;
                
                // 模拟导入过程
                setTimeout(() => {
                    alert('数据导入成功！');
                    window.location.href = `P-LEDGER_DETAIL.html?ledger_id=${ledgerId}`;
                }, 1500);
            });

            // 初始化页面
            updateFormData();
        });
    </script>
</body>
</html>
